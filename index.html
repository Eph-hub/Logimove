            --text-secondary: #94a3b8;
            --border: #334155;

            font-family: 'Inter', system-ui, sans-serif;
            transition: background 0.3s, color 0.3s;
        }
        body.light {
            --bg: #f1f5f9;
            --card: white;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --primary-bg: #eef2ff;

        .card { background: var(--card); border-color: var(--border); }
        .btn-primary { background: var(--primary); color: white; padding: 0.6rem 1.5rem; border-radius: 2rem; font-weight: 600; transition: background 0.2s; cursor: pointer; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .bg-primary-light { background: var(--primary-bg); }
        .text-primary { color: var(--primary); }
        .map-container { height: 280px; width: 100%; border-radius: 1.5rem; overflow: hidden; }

        .loc-card { background: var(--bg); border: 2px solid var(--border); border-radius: 0.75rem; padding: 0.2rem 0.6rem; display: flex; align-items: center; gap: 0.3rem; transition: border 0.2s; }

        .loc-card.active-dropoff { border-color: #3b82f6; }
        .loc-card .icon { font-size: 1rem; flex-shrink: 0; }

        .loc-card input::placeholder { color: var(--text-secondary); font-size: 0.7rem; }
        .loc-card .clear-btn { cursor: pointer; color: #ef4444; font-size: 0.7rem; flex-shrink: 0; padding: 0 0.2rem; }
        .autocomplete-dropdown { position: absolute; background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; max-height: 220px; overflow-y: auto; z-index: 30; width: 100%; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .autocomplete-item { padding: 0.5rem 1rem; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .autocomplete-item:hover { background: var(--primary-bg); }
        .saved-place-item { background: var(--primary-bg); color: var(--text); padding: 0.2rem 1rem; border-radius: 2rem; font-size: 0.8rem; cursor: pointer; display: inline-block; margin: 2px; }
        .saved-place-item:hover { background: var(--primary-light); }
        .chat-badge { background: #ef4444; color: white; border-radius: 50%; padding: 0 0.4rem; font-size: 0.7rem; font-weight: bold; margin-left: 4px; }
        .restaurant-card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 0.75rem; transition: 0.2s; cursor: pointer; }
        .restaurant-card:hover { transform: scale(1.02); border-color: var(--primary); }
        .menu-item { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid var(--border); }
        .cart-item { display: flex; justify-content: space-between; padding: 0.4rem 0; }

    function formatDate(t) { if (!t) return 'Unknown'; const d = t.toDate ? t.toDate() : new Date(t); return d.toLocaleDateString('en-ZM',{day:'2-digit',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-ZM',{hour:'2-digit',minute:'2-digit'}); }
    function formatTime(t) { if (!t) return ''; const d = t.toDate ? t.toDate() : new Date(t); return d.toLocaleTimeString('en-ZM',{day:'2-digit',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-ZM',{hour:'2-digit',minute:'2-digit'}); }
    function haversine(lat1,lng1,lat2,lng2) { const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLng=(lng2-lng1)*Math.PI/180; const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
    function estimateTime(dist) { const min=Math.round((dist/30)*60); if(min<1) return '1 min'; if(min<60) return min+' min'; const h=Math.floor(min/60); const m=min%60; return h+'h '+m+'min'; }

    function calculatePrice(dist, vehicleType = 'Car', weight = 0, dims = '', stops = 0) {
        let base = RATES[serviceType]?.base || 30;
        let perKm = RATES[serviceType]?.perKm || 10;
        if (vehicleType === 'Bike') { base *= 0.7; perKm *= 0.8; }
        else if (vehicleType === 'Truck') { base *= 1.5; perKm *= 1.3; }
        let price = base + dist * perKm;
        price += (stops || 0) * 5;
        if (serviceType === 'delivery' || serviceType === 'cargo') {
            const w = parseFloat(weight) || 0;
            if (w > 50) price += 20;
            else if (w > 20) price += 10;
            if (dims) {
                const parts = dims.split('x').map(Number);
                if (parts.length === 3 && parts[0] * parts[1] * parts[2] > 50000) price += 15;
            }
        }
        return Math.round(price * 2) / 2;
    }

    function updatePriceDisplay(vehicleType = 'Car', weight = 0, dims = '', stops = 0) {
        if (!tempPickup || !tempDropoff) return;
        let dist = haversine(tempPickup.lat, tempPickup.lng, tempDropoff.lat, tempDropoff.lng);
        const price = calculatePrice(dist, vehicleType, weight, dims, stops);
        const pInput = document.getElementById('priceInput');
        if (pInput) pInput.value = price;
        const dSpan = document.getElementById('distanceDisplay');
        if (dSpan) dSpan.innerText = dist.toFixed(2) + ' km';
        const eSpan = document.getElementById('etaDisplay');
        if (eSpan) eSpan.innerText = estimateTime(dist);
        const aSpan = document.getElementById('autoPriceDisplay');
        if (aSpan) aSpan.innerText = `${CURRENCY}${price}`;
        const bSpan = document.getElementById('fareBreakdown');
        if (bSpan) bSpan.innerText = `${vehicleType || 'Car'} • ${dist.toFixed(2)}km • ${CURRENCY}${price}` + (stops ? ` (+${stops} stops)` : '');
        const estSpan = document.getElementById('fareEstimate');
        if (estSpan) { const min = price * 0.85, max = price * 1.15; estSpan.innerText = `Est. ${CURRENCY}${min.toFixed(2)} – ${CURRENCY}${max.toFixed(2)}`; }
        return { dist, price };
    }

    function playNotificationSound() { try { const audioCtx = new(window.AudioContext || window.webkitAudioContext)(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.value = 800; osc.type = 'sine'; gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.4); } catch(e) {} }

    function listenRequests() {
        if (unsubscribeRequests) unsubscribeRequests();
        const q = query(collection(db, "requests"), orderBy("createdAt", "desc"));
        unsubscribeRequests = onSnapshot(q, (snap) => {
            const newDocs = snap.docChanges().filter(change => change.type === 'added');
            if (currentRole === 'driver' && driverData.status === 'online') {
                newDocs.forEach(change => {
                    const req = { id: change.doc.id, ...change.doc.data() };
                    if (req.status === 'pending' && !seenRequestIds.has(req.id)) {
                        seenRequestIds.add(req.id);
                        newOrderCount++;
                        playNotificationSound();
                        const type = req.type === 'taxi' ? '🚖 Taxi' : '📦 Delivery';
                        showNotification(`New ${type} request!`, `From ${req.customerName} • ${CURRENCY}${req.price}`);
                        updateNewOrderBadge();
                    }
                });
            }
            allRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (currentRole === 'customer') { updateFrequentTrips(); renderCustomerTabs(); }
            else if (currentRole === 'driver') renderDriverTabs();
            else if (currentRole === 'admin') renderAdminPanel();
            if (navigator.onLine) { localStorage.setItem('cachedRequests', JSON.stringify(allRequests)); localStorage.setItem('cachedUser', JSON.stringify(currentUser)); }
        });
    }

    function updateFrequentTrips() {
        const userTrips = allRequests.filter(r => r.customerId === currentUser?.uid && r.status === 'delivered');
        if (userTrips.length < 2) return;
        const routeCount = {};
        userTrips.forEach(r => { const key = `${r.pickupAddress}|${r.dropoffAddress}`; routeCount[key] = (routeCount[key] || 0) + 1; });
        const sorted = Object.entries(routeCount).sort((a, b) => b[1] - a[1]);
        frequentTrips = sorted.slice(0, 3).map(([key, count]) => { const [pickup, dropoff] = key.split('|'); return { pickup, dropoff, count }; });
        setDoc(doc(db, "savedPlaces", currentUser.uid), { frequentTrips }, { merge: true });

        { name: 'Red', primary: '#ef4444', light: '#f87171', dark: '#dc2626', bg: '#450a0a' },
        { name: 'Teal', primary: '#14b8a6', light: '#2dd4bf', dark: '#0d9488', bg: '#042f2e' }
    ];
    let currentTheme = localStorage.getItem('theme') || 'Indigo';
    function applyTheme(name) {
        const t = themes.find(x => x.name === name); if (!t) return;
        document.documentElement.style.setProperty('--primary', t.primary);
        document.documentElement.style.setProperty('--primary-light', t.light);
        document.documentElement.style.setProperty('--primary-dark', t.dark);
        document.documentElement.style.setProperty('--primary-bg', t.bg);
        document.documentElement.style.setProperty('--primary-hover', t.dark);
        document.documentElement.style.setProperty('--primary-ring', t.primary + '40');
        localStorage.setItem('theme', name);
        currentTheme = name;
        document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.theme === name));
    }
    applyTheme(currentTheme);

    // ============================================================
    // =============== CUSTOMER DASHBOARD =========================
    // ============================================================
    function renderCustomerTabs() {
        document.getElementById('appContainer').innerHTML = `
            <div class="fade-in">
                ${renderHeader(``, 'logoutBtn')}
                <div id="tabContent">${t('loading') || 'Loading...'}</div>
            </div>`;
        document.getElementById('driverModeToggle').onclick = async () => {
            if (currentRole === 'driver') {
                await updateDoc(doc(db, "users", currentUser.uid), { role: 'customer' });
                currentRole = 'customer';
                Swal.fire({ title: 'Switched to Passenger mode', icon: 'info', timer: 1500, showConfirmButton: false });
                renderCustomerTabs();
            } else {
                await updateDoc(doc(db, "users", currentUser.uid), { role: 'driver' });
                currentRole = 'driver';
                const drvSnap = await getDoc(doc(db, "drivers", currentUser.uid));
                if (!drvSnap.exists()) await setDoc(doc(db, "drivers", currentUser.uid), driverData);
                Swal.fire({ title: 'Switched to Driver mode', icon: 'info', timer: 1500, showConfirmButton: false });
                renderDriverTabs();
            }
        };
        document.getElementById('langSelectHeader')?.addEventListener('change', (e) => {
            const lang = e.target.value;
            if (translations[lang]) { currentLang = lang; localStorage.setItem('lang', lang); if (currentUser) { setDoc(doc(db, "userPreferences", currentUser.uid), { language: lang }, { merge: true }); } renderCustomerTabs(); }
        });
        document.getElementById('syncBtn')?.addEventListener('click', syncData);
        const dropdownMenu = document.getElementById('dropdownMenu');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        hamburgerBtn?.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu?.classList.toggle('open'); });
        document.addEventListener('click', (e) => {
            if (dropdownMenu && hamburgerBtn && !dropdownMenu.contains(e.target) && !hamburgerBtn.contains(e.target)) dropdownMenu.classList.remove('open');
        });
        dropdownMenu?.querySelectorAll('[data-tab]').forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = item.dataset.tab;
                if (tab === 'profile') { showProfileModal(); dropdownMenu.classList.remove('open'); return; }
                dropdownMenu.classList.remove('open');
                activeTab = tab;
                renderCustomerTabs();
            });
        });
        document.getElementById('logoutBtn').onclick = async () => { await signOut(auth); currentUser = null; renderLogin(); };
        document.getElementById('refreshBtn').onclick = () => { listenRequests(); Swal.fire({ title: 'Refreshed!', icon: 'success', timer: 800, showConfirmButton: false }); };
        document.getElementById('modeToggle').onclick = () => { document.body.classList.toggle('light'); localStorage.setItem('lightMode', document.body.classList.contains('light')); renderCustomerTabs(); };
        const content = document.getElementById('tabContent');
        if (activeTab === 'rides') renderRidesTab(content);
        else if (activeTab === 'food') renderCustomerFoodTab(content);
        else if (activeTab === 'shops') renderImprovedShopsTab(content);
        else if (activeTab === 'cargo') renderCustomerCargoTab(content);
        else if (activeTab === 'history') renderImprovedHistoryTab(content);
        else if (activeTab === 'support') renderImprovedSupportTab(content);
        else if (activeTab === 'referral') renderReferralTab(content);
        else renderRidesTab(content);
        updateNewOrderBadge();
    }

            stopDiv.innerHTML = `
                <span class="text-xs text-gray-400">Stop ${idx + 1}:</span>

                if (query.length < 2) return;

            stopDiv.querySelector('.stop-remove-btn').addEventListener('click', () => { tempStops.splice(idx, 1); renderRidesTab(container); });

            const weight = document.getElementById('cargoWeight')?.value || 0;
            const dims = document.getElementById('cargoDims')?.value || '';
            updatePriceDisplay(vehicle, weight, dims, tempStops.length);
        });
        document.getElementById('estimateBtn')?.addEventListener('click', () => {
            if (!tempPickup || !tempDropoff) { Swal.fire('Missing locations', 'Please set both pickup and dropoff.', 'info'); return; }
            const vehicle = document.getElementById('vehicleSelect')?.value || 'Car';
            const weight = document.getElementById('cargoWeight')?.value || 0;
            const dims = document.getElementById('cargoDims')?.value || '';
            const result = updatePriceDisplay(vehicle, weight, dims, tempStops.length);
            if (result) {
                const min = result.price * 0.85, max = result.price * 1.15;
                Swal.fire({
                    title: '💰 ' + t('getEstimate'),
                    html: `
                        <div class="text-left">
                            <p><strong>${t('distance')}:</strong> ${result.dist.toFixed(2)} km</p>
                            <p><strong>${t('eta')}:</strong> ${estimateTime(result.dist)}</p>
                            <p><strong>Vehicle:</strong> ${vehicle}</p>
                            <p><strong>Stops:</strong> ${tempStops.length}</p>
                            <p><strong>${t('estimateRange')}:</strong> ${CURRENCY}${min.toFixed(2)} – ${CURRENCY}${max.toFixed(2)}</p>
                            <p><strong>Mid price:</strong> ${CURRENCY}${result.price.toFixed(2)}</p>
                            ${activePromo ? `<p class="text-green-400">✨ Promo ${activePromo.code}: ${activePromo.discount * 100}% off</p>` : ''}
                        </div>
                    `,
                    icon: 'info'
                });
            }
        });
        document.querySelectorAll('.frequent-trip-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const pickup = btn.dataset.pickup, dropoff = btn.dataset.dropoff;
                const pickupResults = await searchAddress(pickup);
                const dropoffResults = await searchAddress(dropoff);
                if (pickupResults.length && dropoffResults.length) {
                    setLocationForMode('pickup', { lat: pickupResults[0].lat, lng: pickupResults[0].lng }, pickup);
                    setLocationForMode('dropoff', { lat: dropoffResults[0].lat, lng: dropoffResults[0].lng }, dropoff);
                    document.getElementById('pickupInput').value = pickup;
                    document.getElementById('dropoffInput').value = dropoff;
                    Swal.fire({ title: 'Route loaded!', icon: 'success', timer: 800 });
                } else { Swal.fire('Could not find addresses', 'Please try typing them manually.', 'warning'); }
            });
        });
        document.getElementById('applyPromoBtn')?.addEventListener('click', () => {
            const code = document.getElementById('promoInput')?.value?.toUpperCase()?.trim();
            if (!code) return Swal.fire('Enter a code');
            if (PROMO_CODES[code] !== undefined) { activePromo = { code, discount: PROMO_CODES[code] }; Swal.fire({ title: `Promo applied! ${code} – ${PROMO_CODES[code] * 100}% off`, icon: 'success', timer: 1500 }); updatePriceDisplay(); }
            else Swal.fire('Invalid code', 'Try SAVE10, SAVE20, or FREE', 'warning');
        });
        // Share trip & emergency call
        document.getElementById('shareTripBtn')?.addEventListener('click', () => {
            const activeTrip = allRequests.find(r => r.customerId === currentUser?.uid && (r.status === 'accepted' || r.status === 'pickedUp'));
            if (!activeTrip) return Swal.fire('No active trip');
            const link = `${window.location.origin}${window.location.pathname}?track=${activeTrip.id}`;
            navigator.clipboard.writeText(link).then(() => { Swal.fire({ title: 'Trip link copied!', text: 'Share this with friends to track your ride.', icon: 'success' }); });
        });
        document.getElementById('callEmergencyBtn')?.addEventListener('click', () => {
            const contact = currentUser?.emergencyContact;
            if (!contact) return Swal.fire('No emergency contact', 'Set one in your profile.', 'info');
            if (confirm(`Call ${contact}?`)) {
                window.location.href = `tel:${contact}`;
            }
        });
        // Check for active trip on load
        checkActiveTripForETA();
    }

    // ---------- ACTIVE TRIP ETA ----------
    function checkActiveTripForETA() {
        const activeTrip = allRequests.find(r => r.customerId === currentUser?.uid && (r.status === 'accepted' || r.status === 'pickedUp'));
        const infoDiv = document.getElementById('activeTripInfo');
        if (!activeTrip || !activeTrip.driverId) { if (infoDiv) infoDiv.classList.add('hidden'); if (activeDriverETAInterval) { clearInterval(activeDriverETAInterval); activeDriverETAInterval = null; } return; }
        if (infoDiv) infoDiv.classList.remove('hidden');
        if (activeDriverETAInterval) clearInterval(activeDriverETAInterval);
        // Listen to driver location
        if (driverPosUnsub) driverPosUnsub();
        driverPosUnsub = onSnapshot(doc(db, "drivers", activeTrip.driverId), (docSnap) => {
            if (docSnap.exists() && activeTrip.dropoffLatLng) {
                const loc = docSnap.data();
                const dist = haversine(loc.currentLat || 0, loc.currentLng || 0, activeTrip.dropoffLatLng.lat, activeTrip.dropoffLatLng.lng);
                const etaMin = Math.round(dist / 30 * 60);
                const etaSpan = document.getElementById('driverETAValue');
                if (etaSpan) etaSpan.innerText = etaMin > 0 ? `${etaMin} ${t('min')}` : 'Arriving';
                const progressBar = document.getElementById('etaProgressBar');
                if (progressBar) {
                    // Estimate progress: assume total distance was ~10km initially; if dist < 1, 100%
                    const maxDist = 10;
                    const progress = Math.min(100, ((maxDist - dist) / maxDist) * 100);
                    progressBar.style.width = `${Math.max(0, Math.min(100, progress))}%`;
                }
                // Update driver marker on map
                if (window.customerMap) {
                    const lat = loc.currentLat || 0, lng = loc.currentLng || 0;
                    if (driverMarkerCust) { driverMarkerCust.setLatLng([lat, lng]); }
                    else {
                        driverMarkerCust = L.marker([lat, lng], { icon: L.divIcon({ html: '<i class="fas fa-truck-fast text-indigo-700 text-2xl"></i>', iconSize: [24, 24] }) }).addTo(window.customerMap).bindTooltip('Driver');
                    }
                    if (activeTrip.dropoffLatLng) {
                        const eta = estimateTime(dist);
                        driverMarkerCust.bindTooltip(`Driver • ETA ${eta}`).openTooltip();
                    }
                }
            }
        });
    }

    // ============================================================
    // =============== IMPROVED SHOPS TAB ==========================
    // ============================================================
    function renderImprovedShopsTab(container) {
        let shops = [];
        let shopReviews = {};

        const loadShops = async () => {
            const snap = await getDocs(collection(db, "restaurants"));
            if (!snap.empty) {
                shops = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.cuisine && r.cuisine.toLowerCase().includes('supermarket'));
            } else {
                shops = [
                    { name: "Shoprite", logo: "🛒", cuisine: "Supermarket", location: "Lusaka", address: "Plot 123, Cairo Road", phone: "+260 211 123456", hours: "Mon-Sat 8am-8pm, Sun 9am-6pm", open: true, lat: -15.4200, lng: 28.2830, rating: 4.0 },
                    { name: "Pick n Pay", logo: "🛍️", cuisine: "Supermarket", location: "Lusaka", address: "Manda Hill Mall", phone: "+260 211 789012", hours: "Mon-Sun 9am-9pm", open: true, lat: -15.3950, lng: 28.3000, rating: 4.2 },
                    { name: "Game", logo: "🎮", cuisine: "Supermarket", location: "Lusaka", address: "Eastpark Mall", phone: "+260 211 345678", hours: "Mon-Sun 9am-8pm", open: true, lat: -15.4100, lng: 28.3200, rating: 3.8 }
                ];
                for (const r of shops) await addDoc(collection(db, "restaurants"), r);
            }
            // Load reviews
            const reviewSnap = await getDocs(collection(db, "shopReviews"));
            reviewSnap.forEach(d => {
                const data = d.data();
                if (!shopReviews[data.shopName]) shopReviews[data.shopName] = [];
                shopReviews[data.shopName].push(data);
            });
            renderShopList();
        };

        const renderShopList = () => {
            const searchQuery = document.getElementById('shopSearch')?.value?.toLowerCase() || '';
            const filterCat = document.getElementById('shopCategoryFilter')?.value || 'all';

            let filtered = shops.filter(s => {
                const nameMatch = s.name.toLowerCase().includes(searchQuery);
                const catMatch = filterCat === 'all' || (s.cuisine && s.cuisine.toLowerCase().includes(filterCat));
                return nameMatch && catMatch;
            });

            container.innerHTML = `
                <h3 class="text-xl font-bold mb-3">🛒 ${t('shops')}</h3>
                <div class="flex flex-wrap gap-2 mb-3">
                    <input type="text" id="shopSearch" placeholder="Search shops..." class="text-sm flex-1 min-w-[120px]">
                    <select id="shopCategoryFilter" class="text-sm">
                        <option value="all">All Categories</option>
                        <option value="supermarket">Supermarket</option>
                        <option value="hardware">Hardware</option>
                        <option value="pharmacy">Pharmacy</option>
                        <option value="electronics">Electronics</option>
                    </select>
                    <button id="shopFilterClear" class="text-xs bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full">Clear</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    ${filtered.map(s => {
                        const avgRating = shopReviews[s.name] ? shopReviews[s.name].reduce((sum, r) => sum + r.rating, 0) / shopReviews[s.name].length : s.rating || 0;
                        const stars = '⭐'.repeat(Math.round(avgRating)) + '☆'.repeat(5 - Math.round(avgRating));
                        return `
                            <div class="restaurant-card" data-id="${s.id || s.name}">
                                <div class="flex items-center gap-2">
                                    <span class="text-3xl">${s.logo || '🏪'}</span>
                                    <div class="flex-1">
                                        <div class="font-bold">${s.name}</div>
                                        <div class="text-xs opacity-60">${s.cuisine} • ${s.location}</div>
                                        <div class="text-xs">${stars} ${avgRating.toFixed(1)}</div>
                                    </div>
                                    <span class="text-xs ${s.open ? 'text-green-500' : 'text-red-500'}">${s.open ? '✅ Open' : '❌ Closed'}</span>
                                </div>
                                <button class="view-shop-btn mt-2 text-sm bg-primary text-white px-3 py-1 rounded-full" data-name="${s.name}">View Details</button>
                            </div>
                        `;
                    }).join('')}
                </div>
                <div id="shopDetailModal" class="hidden"></div>
            `;

            document.getElementById('shopSearch')?.addEventListener('input', renderShopList);
            document.getElementById('shopCategoryFilter')?.addEventListener('change', renderShopList);
            document.getElementById('shopFilterClear')?.addEventListener('click', () => {
                document.getElementById('shopSearch').value = '';
                document.getElementById('shopCategoryFilter').value = 'all';
                renderShopList();
            });

            document.querySelectorAll('.view-shop-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const name = btn.dataset.name;
                    const shop = shops.find(s => s.name === name);
                    if (!shop) return;
                    showShopDetails(shop);
                });
            });
        };

        const showShopDetails = (shop) => {
            const reviews = shopReviews[shop.name] || [];
            const avgRating = reviews.length ? reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length : shop.rating || 0;
            const stars = '⭐'.repeat(Math.round(avgRating)) + '☆'.repeat(5 - Math.round(avgRating));

            Swal.fire({
                title: `${shop.logo || '🏪'} ${shop.name}`,
                html: `
                    <div class="text-left">
                        <div class="shop-detail-item"><i class="fas fa-tag"></i> ${shop.cuisine || 'General'}</div>
                        <div class="shop-detail-item"><i class="fas fa-map-marker-alt"></i> ${shop.address || 'Address not available'}</div>
                        <div class="shop-detail-item"><i class="fas fa-phone"></i> ${shop.phone || 'Phone not available'}</div>
                        <div class="shop-detail-item"><i class="fas fa-clock"></i> ${shop.hours || 'Hours not available'}</div>
                        <div class="shop-detail-item"><i class="fas fa-star"></i> ${stars} ${avgRating.toFixed(1)} (${reviews.length} reviews)</div>
                        <div class="flex gap-2 mt-3 flex-wrap">
                            ${shop.lat && shop.lng ? `<button id="navigateShopBtn" class="btn-primary text-sm px-3 py-1">${t('navigate')}</button>` : ''}
                            <button id="reviewShopBtn" class="btn-primary text-sm px-3 py-1 bg-amber-500 hover:bg-amber-600">${t('writeReview')}</button>
                        </div>
                        ${reviews.length ? `<div class="mt-3 max-h-32 overflow-auto"><p class="font-semibold text-sm">Reviews:</p>${reviews.map(r => `<div class="text-xs border-b border-gray-200 dark:border-gray-700 py-1"><b>${r.userName || 'User'}</b>: ${'⭐'.repeat(r.rating)} ${r.comment || ''}</div>`).join('')}</div>` : '<p class="text-xs text-gray-400 mt-2">No reviews yet.</p>'}
                    </div>
                `,
                confirmButtonText: 'Close',
                didOpen: () => {
                    document.getElementById('navigateShopBtn')?.addEventListener('click', () => {
                        if (shop.lat && shop.lng) {
                            window.open(`https://www.google.com/maps/dir/${tempPickup?.lat || -15.3875},${tempPickup?.lng || 28.3228}/${shop.lat},${shop.lng}`, '_blank');
                        }
                    });
                    document.getElementById('reviewShopBtn')?.addEventListener('click', async () => {
                        const { value: rating } = await Swal.fire({
                            title: `Rate ${shop.name}`,
                            input: 'range',
                            inputLabel: 'Rating (1-5)',
                            inputAttributes: { min: 1, max: 5, step: 1, value: 5 },
                            showCancelButton: true
                        });
                        if (rating) {
                            const { value: comment } = await Swal.fire({
                                title: 'Review (optional)',
                                input: 'text',
                                showCancelButton: true
                            });
                            await addDoc(collection(db, "shopReviews"), {
                                shopName: shop.name,
                                rating: parseInt(rating),
                                comment: comment || '',
                                userId: currentUser.uid,
                                userName: currentUser.displayName || currentUser.email,
                                timestamp: serverTimestamp()
                            });
                            Swal.fire({ title: 'Review submitted!', icon: 'success', timer: 1500 });
                            // Refresh
                            shopReviews[shop.name] = [...(shopReviews[shop.name] || []), { rating: parseInt(rating), comment: comment || '', userName: currentUser.displayName || currentUser.email }];
                            showShopDetails(shop);
                        }
                    });
                }
            });
        };

        loadShops();
    }

    function renderImprovedHistoryTab(container) {
        const rideHistory = allRequests.filter(r => r.customerId === currentUser.uid);

        const renderHistory = (filterType = 'all', filterStatus = 'all', filterDate = '') => {
            let filtered = rideHistory;
            if (filterType !== 'all') filtered = filtered.filter(r => r.type === filterType);
            if (filterStatus !== 'all') filtered = filtered.filter(r => r.status === filterStatus);
            if (filterDate) {
                const d = new Date(filterDate);
                const ds = d.toDateString();
                filtered = filtered.filter(r => r.createdAt?.toDate?.()?.toDateString() === ds);
            }
            filtered.sort((a, b) => (b.createdAt?.toDate?.() || 0) - (a.createdAt?.toDate?.() || 0));

            const getFoodOrders = async () => {
                const snap = await getDocs(query(collection(db, "foodOrders"), where("customerId", "==", currentUser.uid), orderBy("createdAt", "desc")));

                            <div class="border-b border-gray-100 dark:border-gray-700 py-2">
                                <div class="flex justify-between items-center">
                                    <span class="font-medium">Order #${o.id.substring(0, 6)}</span>
                                    <span class="text-xs ${o.status === 'delivered' ? 'text-green-500' : o.status === 'canceled' ? 'text-red-500' : 'text-amber-400'}">${o.status}</span>
                                </div>
                                <div class="text-xs">${o.items.map(i => `${i.name} × ${i.qty}`).join(', ')} – ${CURRENCY}${o.total}</div>
                                <div class="text-xs text-gray-400">📅 ${formatDate(o.createdAt)}</div>
                                ${o.status === 'delivered' ? `<button class="reorder-food text-xs text-purple-500" data-id="${o.id}">🔄 ${t('rebook')}</button>` : ''}
                            </div>
                        `).join('');
                    }
                }
                container.innerHTML = html;

                // Event bindings
                document.querySelectorAll('.view-trip').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const trip = allRequests.find(r => r.id === btn.dataset.id);
                        if (trip && trip.pickupLatLng && trip.dropoffLatLng) {
                            Swal.fire({
                                title: 'Trip route',
                                html: `<div id="miniMap" style="height:200px;"></div>`,
                                didOpen: () => {
                                    setTimeout(() => {
                                        const map = L.map('miniMap').setView([trip.pickupLatLng.lat, trip.pickupLatLng.lng], 12);
                                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                                        L.marker([trip.pickupLatLng.lat, trip.pickupLatLng.lng]).addTo(map).bindTooltip('Pickup');
                                        L.marker([trip.dropoffLatLng.lat, trip.dropoffLatLng.lng]).addTo(map).bindTooltip('Dropoff');
                                        L.Routing.control({
                                            waypoints: [L.latLng(trip.pickupLatLng.lat, trip.pickupLatLng.lng), L.latLng(trip.dropoffLatLng.lat, trip.dropoffLatLng.lng)],
                                            routeWhileDragging: false,
                                            showAlternatives: false,
                                            lineOptions: { styles: [{ color: 'var(--primary)', weight: 4 }] },
                                            createMarker: function() { return null; }
                                        }).addTo(map);
                                    }, 100);
                                }
                            });
                        }
                    });
                });

                document.querySelectorAll('.rebook-trip').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const trip = allRequests.find(r => r.id === btn.dataset.id);
                        if (trip) {
                            setLocationForMode('pickup', { lat: trip.pickupLatLng.lat, lng: trip.pickupLatLng.lng }, trip.pickupAddress);
                            setLocationForMode('dropoff', { lat: trip.dropoffLatLng.lat, lng: trip.dropoffLatLng.lng }, trip.dropoffAddress);
                            document.getElementById('pickupInput').value = trip.pickupAddress;
                            document.getElementById('dropoffInput').value = trip.dropoffAddress;
                            activeTab = 'rides';
                            renderCustomerTabs();
                            Swal.fire({ title: 'Route loaded!', icon: 'success', timer: 1000 });
                        }
                    });
                });

                document.querySelectorAll('.view-receipt').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const trip = allRequests.find(r => r.id === btn.dataset.id);
                        if (trip) {
                            const base = RATES[trip.type]?.base || 20;
                            const dist = haversine(trip.pickupLatLng.lat, trip.pickupLatLng.lng, trip.dropoffLatLng.lat, trip.dropoffLatLng.lng);
                            const distFee = (RATES[trip.type]?.perKm || 5) * dist;
                            const waitTime = 0; // placeholder
                            const promoDiscount = trip.promoCode ? trip.price * PROMO_CODES[trip.promoCode] : 0;
                            Swal.fire({
                                title: '🧾 ' + t('receipt'),
                                html: `
                                    <div class="text-left">
                                        <div class="receipt-row"><span>${t('tripNumber') || 'Trip #'}</span><span>#${trip.tripNumber || trip.id.substring(0, 6)}</span></div>
                                        <div class="receipt-row"><span>${t('type') || 'Type'}</span><span>${trip.type}</span></div>
                                        <div class="receipt-row"><span>${t('baseFare')}</span><span>${CURRENCY}${base.toFixed(2)}</span></div>
                                        <div class="receipt-row"><span>${t('distanceFee')}</span><span>${CURRENCY}${distFee.toFixed(2)}</span></div>
                                        <div class="receipt-row"><span>${t('waitTime')}</span><span>${CURRENCY}${waitTime.toFixed(2)}</span></div>
                                        ${promoDiscount > 0 ? `<div class="receipt-row"><span>${t('promoDiscount')}</span><span>-${CURRENCY}${promoDiscount.toFixed(2)}</span></div>` : ''}
                                        <div class="receipt-total"><span>${t('totalPaid')}</span><span>${CURRENCY}${trip.price.toFixed(2)}</span></div>
                                        ${trip.promoCode ? `<div class="text-xs text-gray-400 mt-1">✨ Promo: ${trip.promoCode}</div>` : ''}
                                        <div class="text-xs text-gray-400 mt-2">📅 ${formatDate(trip.createdAt)}</div>
                                    </div>
                                `,
                                confirmButtonText: 'Close'
                            });
                        }
                    });
                });

                document.querySelectorAll('.reorder-food').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const order = foodOrders.find(o => o.id === btn.dataset.id);
                        if (order) {
                            order.items.forEach(item => {
                                const existing = foodCart.find(x => x.name === item.name && x.restaurant === order.restaurantName);
                                if (existing) existing.qty += item.qty;
                                else foodCart.push({ restaurant: order.restaurantName, name: item.name, price: item.price, qty: item.qty });
                            });
                            saveFoodCart();
                            activeTab = 'food';
                            renderCustomerTabs();
                            Swal.fire({ title: 'Items added to cart!', icon: 'success', timer: 1000 });
                        }
                    });
                });
            };
            getFoodOrders();
        };

        // Build filter UI
        container.innerHTML = `
            <h3 class="text-xl font-bold mb-3">📜 ${t('history')}</h3>
            <div class="flex flex-wrap gap-2 mb-3">
                <select id="historyTypeFilter" class="text-sm">
                    <option value="all">All Types</option>
                    <option value="taxi">Taxi</option>
                    <option value="delivery">Delivery</option>
                    <option value="cargo">Cargo</option>
                </select>
                <select id="historyStatusFilter" class="text-sm">
                    <option value="all">All Status</option>
                    <option value="pending">${t('pending')}</option>
                    <option value="accepted">${t('accepted')}</option>
                    <option value="pickedUp">${t('pickedUp')}</option>
                    <option value="delivered">${t('delivered')}</option>
                    <option value="canceled">${t('canceled')}</option>
                </select>
                <input type="date" id="historyDateFilter" class="text-sm">
                <button id="historyFilterClear" class="text-xs bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full">Clear</button>
            </div>
            <div id="historyList"></div>`;

        const renderFiltered = () => {
            const type = document.getElementById('historyTypeFilter').value;
            const status = document.getElementById('historyStatusFilter').value;
            const date = document.getElementById('historyDateFilter').value;
            renderHistory(type, status, date);
        };

        document.getElementById('historyTypeFilter')?.addEventListener('change', renderFiltered);
        document.getElementById('historyStatusFilter')?.addEventListener('change', renderFiltered);
        document.getElementById('historyDateFilter')?.addEventListener('change', renderFiltered);
        document.getElementById('historyFilterClear')?.addEventListener('click', () => {
            document.getElementById('historyTypeFilter').value = 'all';
            document.getElementById('historyStatusFilter').value = 'all';
            document.getElementById('historyDateFilter').value = '';
            renderFiltered();
        });
        renderFiltered();
    }

    // ============================================================
    // =============== IMPROVED SUPPORT TAB ========================
    // ============================================================
    function renderImprovedSupportTab(container) {
        let tickets = [];
        let unsubTickets = null;

        const faqs = [
            { q: 'How do I book a ride?', a: 'Open the Rides tab, enter pickup/dropoff, search, and click Request.' },
            { q: 'How do I track my driver?', a: 'After a driver accepts, you will see a map with the driver\'s location in the Rides tab.' },
            { q: 'What if I need help during a ride?', a: 'Use the SOS button (🆘) on the map screen to alert your driver and emergency contact.' },
            { q: 'How do I pay?', a: 'You can pay with Cash, Airtel Money, MTN Money, Zamtel Pay, or Card.' },
            { q: 'Can I cancel a ride?', a: 'Yes, you can cancel from the driver\'s Active tab or from your History tab before pickup.' }
        ];

        const renderTickets = () => {
            const list = document.getElementById('ticketList');
            if (!list) return;
            if (tickets.length === 0) { list.innerHTML = '<p class="text-sm text-gray-400">No tickets yet.</p>'; return; }
            list.innerHTML = tickets.map(t => {
                const statusClass = t.status === 'open' ? 'status-open' : t.status === 'in-progress' ? 'status-inprogress' : 'status-resolved';
                return `
                    <div class="ticket-item">
                        <div class="flex justify-between items-center">
                            <span class="font-medium">${t.subject}</span>
                            <span class="status-badge ${statusClass}">${t.status}</span>
                        </div>
                        <div class="text-xs text-gray-400">${t.message}</div>
                        <div class="text-xs text-gray-500">📅 ${formatDate(t.timestamp)}</div>
                        ${t.response ? `<div class="text-xs text-green-400 mt-1">📩 Response: ${t.response}</div>` : ''}
                    </div>
                `;
            }).join('');
        };

        // Listen to tickets
        if (unsubTickets) unsubTickets();
        const q = query(collection(db, "supportTickets"), where("userId", "==", currentUser.uid), orderBy("timestamp", "desc"));
        unsubTickets = onSnapshot(q, (snap) => {
            tickets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderTickets();
            // Notify if ticket updated
            snap.docChanges().filter(change => change.type === 'modified').forEach(change => {
                const data = change.doc.data();
                if (data.status === 'resolved') {
                    showNotification('Ticket resolved', `Your ticket "${data.subject}" has been resolved.`);
                }
            });
        });

        container.innerHTML = `
            <div class="space-y-4">
                <h3 class="text-xl font-bold">💬 ${t('support')}</h3>
                <div class="card p-4">
                    <h4 class="font-semibold">❓ ${t('faq')}</h4>
                    ${faqs.map(f => `
                        <details class="border-b border-gray-200 dark:border-gray-700 py-2">
                            <summary class="cursor-pointer font-medium">${f.q}</summary>
                            <p class="text-sm text-gray-400 mt-1">${f.a}</p>
                        </details>
                    `).join('')}
                </div>
                <div class="card p-4">
                    <h4 class="font-semibold">📩 ${t('submitTicket')}</h4>
                    <input type="text" id="ticketSubject" placeholder="${t('subject')}" class="mt-2">
                    <textarea id="ticketMessage" placeholder="${t('message')}" rows="3" class="mt-2"></textarea>
                    <button id="submitTicketBtn" class="btn-primary w-full mt-2">${t('submitTicket')}</button>
                </div>
                <div class="card p-4">
                    <h4 class="font-semibold">📋 ${t('ticketStatus')}</h4>
                    <div id="ticketList"></div>
                </div>
                <div class="card p-4">
                    <h4 class="font-semibold">💬 Live Support Chat</h4>
                    <div id="supportChatMessages" class="h-32 overflow-auto border rounded p-2 mb-2"></div>
                    <div class="flex"><input id="supportChatInput" class="flex-1 text-sm" placeholder="${t('message')}"><button id="supportChatSend" class="bg-primary text-white px-3 rounded ml-1">Send</button></div>
                </div>
            </div>`;

        document.getElementById('submitTicketBtn').addEventListener('click', async () => {
            const subject = document.getElementById('ticketSubject').value.trim();
            const message = document.getElementById('ticketMessage').value.trim();
            if (!subject || !message) return Swal.fire('Please fill all fields');
            await addDoc(collection(db, "supportTickets"), {
                userId: currentUser.uid,
                email: currentUser.email,
                subject,
                message,
                status: 'open',
                response: null,
                timestamp: serverTimestamp()
            });
            Swal.fire({ title: t('ticketSubmitted'), icon: 'success', timer: 1500 });
            document.getElementById('ticketSubject').value = '';
            document.getElementById('ticketMessage').value = '';
        });

        // Live chat
        const supportChatRef = collection(db, "supportChat", currentUser.uid, "messages");
        const chatQ = query(supportChatRef, orderBy("timestamp"));
        let unsubSupportChat = onSnapshot(chatQ, (snap) => {
            const messages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const chatDiv = document.getElementById('supportChatMessages');
            if (chatDiv) {
                chatDiv.innerHTML = messages.map(m => `<div><b>${m.senderName}:</b> ${m.text}</div>`).join('');
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }
        });
        document.getElementById('supportChatSend').addEventListener('click', async () => {
            const input = document.getElementById('supportChatInput');
            const text = input.value.trim();
            if (!text) return;
            await addDoc(supportChatRef, { senderId: currentUser.uid, senderName: currentUser.email, text, timestamp: serverTimestamp() });
            input.value = '';
        });
        // Cleanup
        window._supportCleanup = () => { if (unsubSupportChat) unsubSupportChat(); if (unsubTickets) unsubTickets(); };
    }

    function renderCustomerCargoTab(container) {

                </div>
                <div id="savedPlacesList" class="flex flex-wrap gap-1"></div>

                <div id="customerMap" class="map-container"></div>
                <div class="bg-primary-light p-3 rounded-xl text-sm" style="background:var(--primary-bg);">

            stopDiv.innerHTML = `
                <span class="text-xs text-gray-400">Stop ${idx + 1}:</span>

                const query = input.value.trim();
                if (query.length < 2) return;
                const results = await searchAddress(query);

            }, 300));
            stopDiv.querySelector('.stop-remove-btn').addEventListener('click', () => { tempStops.splice(idx, 1); renderCustomerCargoTab(container); });
            tempStops.push({ lat: 0, lng: 0, address: '' });
        });

            const weight = document.getElementById('cargoWeight')?.value || 0;
            const dims = document.getElementById('cargoDims')?.value || '';
            const result = updatePriceDisplay(vehicle, weight, dims, tempStops.length);
            if (result) {
                const min = result.price * 0.85, max = result.price * 1.15;
                Swal.fire({
                    title: '💰 ' + t('getEstimate'),
                    html: `
                        <div class="text-left">
                            <p><strong>${t('distance')}:</strong> ${result.dist.toFixed(2)} km</p>
