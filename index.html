    // ============================================================
    // =============== HISTORY TAB =================================
    // ============================================================
    function renderCustomerHistoryTab(container) {
        const rideHistory = allRequests.filter(r => r.customerId === currentUser.uid && r.status === 'delivered');
        const getFoodOrders = async () => {
            const snap = await getDocs(query(collection(db,"foodOrders"), where("customerId","==",currentUser.uid), orderBy("createdAt","desc")));
            const foodOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            let html = '';
            if (rideHistory.length === 0 && foodOrders.length === 0) {
                html = `<div class="text-center py-8 text-gray-400">No past trips or food orders</div>`;
            } else {
                if (rideHistory.length) {
                    html += `<h4 class="font-semibold mt-2">🚗 Rides & Deliveries</h4>`;
                    html += rideHistory.map(r => {
                        const tripDisplay = r.tripNumber ? `#${r.tripNumber}` : `#${r.id.substring(0,6)}`;
                        return `<div class="border-b border-gray-100 dark:border-gray-700 py-2 flex justify-between items-center"><div><span class="font-medium">${tripDisplay}</span> ${r.type} – ${CURRENCY}${r.price}<br><span class="text-xs text-gray-400">📅 ${formatDate(r.createdAt)}</span>${r.vehicleType ? ` • ${r.vehicleType}` : ''}${r.promoCode ? ` ✨${r.promoCode}` : ''}</div><button class="view-trip text-sm" style="color:var(--primary);" data-id="${r.id}">View route</button></div>`;
                    }).join('');
                }
                if (foodOrders.length) {
                    html += `<h4 class="font-semibold mt-2">🍔 Food Orders</h4>`;
                    html += foodOrders.map(o => `<div class="border-b border-gray-100 dark:border-gray-700 py-2"><span class="font-medium">Order #${o.id.substring(0,6)}</span> – ${CURRENCY}${o.total}<br><span class="text-xs text-gray-400">📅 ${formatDate(o.createdAt)}</span>${o.promoCode ? ` ✨${o.promoCode}` : ''}</div>`).join('');
                }
            }
            container.innerHTML = html;
            document.querySelectorAll('.view-trip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const trip = allRequests.find(r => r.id === btn.dataset.id);
                    if(trip && trip.pickupLatLng && trip.dropoffLatLng){
                        Swal.fire({title:'Trip route', html:`<div id="miniMap" style="height:200px;"></div>`, didOpen:()=>{setTimeout(()=>{const map=L.map('miniMap').setView([trip.pickupLatLng.lat,trip.pickupLatLng.lng],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); L.marker([trip.pickupLatLng.lat,trip.pickupLatLng.lng]).addTo(map).bindTooltip('Pickup'); L.marker([trip.dropoffLatLng.lat,trip.dropoffLatLng.lng]).addTo(map).bindTooltip('Dropoff'); L.Routing.control({waypoints:[L.latLng(trip.pickupLatLng.lat,trip.pickupLatLng.lng),L.latLng(trip.dropoffLatLng.lat,trip.dropoffLatLng.lng)],routeWhileDragging:false,showAlternatives:false,lineOptions:{styles:[{color:'var(--primary)',weight:4}]},createMarker:function(){return null;}}).addTo(map);},100);}});
                    }
                });
            });
        };
        getFoodOrders();
    }

    // ============================================================
    // =============== DRIVER DASHBOARD ===========================
    // ============================================================
    function renderDriverTabs() {
        const completed = allRequests.filter(r => r.driverId === currentUser.uid && r.status === 'delivered');
        const total = completed.reduce((s,r) => s + r.price, 0);
        const today = new Date().toDateString();
        const todayEarn = completed.filter(r => r.createdAt?.toDate?.()?.toDateString() === today).reduce((s,r) => s + r.price, 0);
        document.getElementById('appContainer').innerHTML = `
            <div class="fade-in">
                ${renderHeader(`🚚 Driver`, 'logoutDriver')}
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <div class="bg-primary-light p-2 rounded-xl text-center" style="background:var(--primary-bg);"><span class="text-xs">Today</span><div class="font-bold">${CURRENCY}${todayEarn}</div></div>
                    <div class="bg-blue-50 dark:bg-blue-900 p-2 rounded-xl text-center"><span class="text-xs">Week</span><div class="font-bold">${CURRENCY}${completed.filter(r => r.createdAt?.toDate?.() > new Date(Date.now()-7*86400000)).reduce((s,r)=>s+r.price,0)}</div></div>
                    <div class="bg-amber-50 dark:bg-amber-900 p-2 rounded-xl text-center"><span class="text-xs">Total</span><div class="font-bold">${CURRENCY}${total}</div></div>
                </div>
                <div class="flex items-center gap-2 text-sm mb-3"><span>⭐ Rating: ${driverData.averageRating?.toFixed(1) || 'N/A'}</span><span class="bg-green-100 dark:bg-green-900 px-3 py-0.5 rounded-full">${driverData.status}</span></div>
                <div class="flex gap-4 border-b border-gray-200 dark:border-gray-700 mb-4 overflow-x-auto">
                    <button class="tab-btn pb-2 text-gray-500 dark:text-gray-400 font-medium whitespace-nowrap ${activeTab==='map'?'tab-active':''}" data-tab="map">🗺️ Map</button>
                    <button class="tab-btn pb-2 text-gray-500 dark:text-gray-400 font-medium whitespace-nowrap ${activeTab==='requests'?'tab-active':''}" data-tab="requests">📋 Available <span id="newOrderBadge" class="new-order-badge hidden">0</span></button>
                    <button class="tab-btn pb-2 text-gray-500 dark:text-gray-400 font-medium whitespace-nowrap ${activeTab==='active'?'tab-active':''}" data-tab="active">🚦 Active</button>
                    <button class="tab-btn pb-2 text-gray-500 dark:text-gray-400 font-medium whitespace-nowrap ${activeTab==='history'?'tab-active':''}" data-tab="history">📜 History</button>
                </div>
                <div id="tabContent" class="card p-4 md:p-5 rounded-2xl shadow">Loading...</div>
            </div>`;
        document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{
            activeTab=btn.dataset.tab;
            if (activeTab === 'requests') resetNewOrderBadge();
            renderDriverTabs();
        }));
        document.getElementById('logoutDriver').onclick=async()=>{await signOut(auth); currentUser=null; renderLogin();};
        document.getElementById('refreshBtn').onclick=()=>{listenRequests(); Swal.fire({title:'Refreshed!',icon:'success',timer:800});};
        document.getElementById('modeToggle').onclick=()=>{document.body.classList.toggle('light'); localStorage.setItem('lightMode',document.body.classList.contains('light')); renderDriverTabs();};
        document.getElementById('driverModeToggle').onclick = async () => {
            await updateDoc(doc(db, "users", currentUser.uid), { role: 'customer' });
            currentRole = 'customer';
            Swal.fire({ title: 'Switched to Passenger mode', icon: 'info', timer: 1500, showConfirmButton: false });
            renderCustomerTabs();
        };

        const dropdownMenu = document.getElementById('dropdownMenu');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        hamburgerBtn?.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu?.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (dropdownMenu && hamburgerBtn && 
                !dropdownMenu.contains(e.target) && 
                !hamburgerBtn.contains(e.target)) {
                dropdownMenu.classList.remove('open');
            }
        });
        dropdownMenu?.querySelectorAll('[data-tab]').forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = item.dataset.tab;
                if (tab === 'profile') {
                    showProfileModal();
                    dropdownMenu.classList.remove('open');
                    return;
                }
                dropdownMenu.classList.remove('open');
                activeTab = tab;
                renderDriverTabs();
            });
        });

        const content=document.getElementById('tabContent');
        if(activeTab==='map') renderDriverMapTab(content);
        else if(activeTab==='requests') renderDriverAvailableTab(content);
        else if(activeTab==='active') renderDriverActiveTab(content);
        else if(activeTab==='history') renderDriverHistoryTab(content);
        updateNewOrderBadge();
    }

    function renderDriverMapTab(container) {
        container.innerHTML = `<div id="driverMap" class="map-container"></div><div class="flex gap-2 mt-2"><button id="gpsBtn" class="text-sm bg-gray-100 dark:bg-gray-700 px-4 py-1 rounded-full">📍 GPS</button><button id="centerDriverMap" class="text-sm bg-gray-100 dark:bg-gray-700 px-4 py-1 rounded-full">🎯 Center</button></div>`;
        initDriverMap();
        document.getElementById('gpsBtn').onclick = () => { if(navigator.geolocation){Swal.fire({title:'Getting location...',timer:2000,didOpen:()=>Swal.showLoading()}); navigator.geolocation.getCurrentPosition(pos=>{updateDriverLoc(pos.coords.latitude,pos.coords.longitude); Swal.close();});}};
        document.getElementById('centerDriverMap').onclick = () => driverMap.setView([driverData.currentLat,driverData.currentLng],14);
    }

    function initDriverMap() {
        if(driverMap){driverMap.remove(); driverMap=null;}
        driverMap = L.map('driverMap').setView([driverData.currentLat,driverData.currentLng],13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(driverMap);
        driverMarker = L.marker([driverData.currentLat,driverData.currentLng], { icon: L.divIcon({ html: '<i class="fas fa-motorcycle text-amber-600 text-2xl"></i>', iconSize: [24,24] }) }).addTo(driverMap).bindTooltip('You');
        window.driverMap = driverMap;
        const activeId = driverData.activeRequestId;
        if(activeId){
            const trip = allRequests.find(r => r.id === activeId);
            if(trip && trip.pickupLatLng && trip.dropoffLatLng){
                L.marker([trip.pickupLatLng.lat,trip.pickupLatLng.lng]).addTo(driverMap).bindTooltip('Pickup');
                L.marker([trip.dropoffLatLng.lat,trip.dropoffLatLng.lng]).addTo(driverMap).bindTooltip('Dropoff');
                L.Routing.control({
                    waypoints: [L.latLng(driverData.currentLat,driverData.currentLng), L.latLng(trip.dropoffLatLng.lat,trip.dropoffLatLng.lng)],
                    routeWhileDragging: false,
                    showAlternatives: false,
                    lineOptions: {styles: [{color: 'var(--primary)', weight: 4}]},
                    createMarker: function() { return null; }
                }).addTo(driverMap);
            }
        }
    }

    async function updateDriverLoc(lat,lng) {
        driverData.currentLat=lat; driverData.currentLng=lng;
        await updateDoc(doc(db,"drivers",currentUser.uid),{currentLat:lat,currentLng:lng});
        if(driverMarker) driverMarker.setLatLng([lat,lng]);
        if(driverMap) driverMap.setView([lat,lng],13);
        renderDriverTabs();
    }

    function renderDriverAvailableTab(container) {
        const getFoodOrders = async () => {
            const snap = await getDocs(query(collection(db,"foodOrders"), where("status","==","pending")));
            const foodOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const pendingRides = allRequests.filter(r => r.status === 'pending');
            let combined = [...pendingRides.map(r => ({ ...r, displayType: r.type === 'taxi' ? '🚖 Taxi' : '📦 Delivery', isFood: false }))];
            combined = [...combined, ...foodOrders.map(o => ({ id: o.id, customerName: o.customerName, displayType: '🍔 Food Order', cargoDetail: o.items.map(i=>`${i.name}×${i.qty}`).join(', '), price: o.total, status: 'pending', isFood: true, createdAt: o.createdAt }))];
            if (combined.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-400">No available requests</div>';
            } else {
                container.innerHTML = combined.map(req => {
                    const tripDisplay = req.tripNumber ? `#${req.tripNumber}` : `#${req.id.substring(0,6)}`;
                    return `<div class="border-b border-gray-100 dark:border-gray-700 py-3 flex justify-between items-center">
                        <div><span class="font-medium">${tripDisplay} ${req.displayType}</span> – ${req.cargoDetail}<br><span class="text-xs text-gray-400">${req.customerName} • ${CURRENCY}${req.price}</span></div>
                        <button class="acceptReq bg-primary text-white px-4 py-1 rounded-full text-sm" data-id="${req.id}" data-food="${req.isFood||false}">Accept</button>
                    </div>`;
                }).join('');
                document.querySelectorAll('.acceptReq').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        const isFood = btn.dataset.food === 'true';
                        if (isFood) {
                            await updateDoc(doc(db,"foodOrders", id), { status: 'accepted', driverId: currentUser.uid, driverName: currentUser.email });
                            showNotification('Food order accepted', 'You will deliver this order.');
                            renderDriverTabs();
                        } else {
                            const req = allRequests.find(r => r.id === id);
                            if (req && req.status === 'pending' && driverData.status !== 'busy') {
                                const driverSnap = await getDoc(doc(db,"drivers",currentUser.uid));
                                const drv = driverSnap.data() || {};
                                await updateDoc(doc(db,"requests", req.id), {
                                    status: 'accepted',
                                    driverId: currentUser.uid,
                                    driverName: currentUser.email,
                                    driverCar: drv.carModel || '',
                                    driverPlate: drv.plate || ''
                                });
                                await updateDoc(doc(db,"drivers",currentUser.uid), { activeRequestId: req.id, status: "busy" });
                                driverData.activeRequestId = req.id; driverData.status = "busy";
                                renderDriverTabs();
                                showNotification('Accepted', `You took ${req.type} from ${req.customerName}`);
                            } else Swal.fire('Cannot accept', 'Busy or taken', 'warning');
                        }
                    });
                });
            }
        };
        getFoodOrders();
        resetNewOrderBadge();
    }

    function renderDriverActiveTab(container) {
        const activeId = driverData.activeRequestId;
        if (!activeId) { container.innerHTML = '<div class="text-center py-8 text-gray-400">No active trip</div>'; return; }
        const trip = allRequests.find(r => r.id === activeId);
        if (!trip) { container.innerHTML = '<div class="text-center py-8 text-gray-400">Loading...</div>'; return; }
        const distToDropoff = trip.dropoffLatLng ? haversine(driverData.currentLat,driverData.currentLng,trip.dropoffLatLng.lat,trip.dropoffLatLng.lng) : 0;
        const tripDisplay = trip.tripNumber ? `#${trip.tripNumber}` : `#${trip.id.substring(0,6)}`;
        let progressHtml = '';
        if (trip.status === 'accepted') progressHtml = `<div class="progress-step flex items-center gap-2"><span class="dot w-3 h-3 rounded-full bg-green-500"></span> Accepted <span class="flex-1 h-0.5 bg-green-500"></span><span class="dot w-3 h-3 rounded-full bg-primary"></span> Go to pickup <span class="flex-1 h-0.5 bg-gray-300"></span><span class="dot w-3 h-3 rounded-full bg-gray-300"></span> Deliver</div>`;
        else if (trip.status === 'pickedUp') progressHtml = `<div class="progress-step flex items-center gap-2"><span class="dot w-3 h-3 rounded-full bg-green-500"></span> Accepted <span class="flex-1 h-0.5 bg-green-500"></span><span class="dot w-3 h-3 rounded-full bg-green-500"></span> Picked up <span class="flex-1 h-0.5 bg-green-500"></span><span class="dot w-3 h-3 rounded-full bg-primary"></span> Delivering</div>`;
        let chatHtml = `<div class="mt-2"><details id="chatDetails"><summary id="chatSummary">💬 Chat with customer <span id="chatBadge" class="chat-badge hidden">0</span></summary><div id="chatMessages" class="h-32 overflow-auto border rounded p-2 mb-2"></div><div class="flex"><input id="chatInput" class="flex-1 text-sm"><button id="sendChat" class="bg-primary text-white px-3 rounded ml-1">Send</button></div></details></div>`;
        container.innerHTML = `
            <div class="space-y-3">
                <div class="flex justify-between"><span class="font-semibold">${tripDisplay}</span><span class="text-sm bg-primary-light text-primary px-3 py-1 rounded-full" style="background:var(--primary-bg); color:var(--primary);">${trip.status}</span></div>
                ${progressHtml}
                <div><span class="text-gray-500">Customer:</span> ${trip.customerName}</div>
                <div><span class="text-gray-500">Details:</span> ${trip.cargoDetail}</div>
                <div><span class="text-gray-500">Price:</span> ${CURRENCY}${trip.price}</div>
                <div><span class="text-gray-500">Vehicle:</span> ${trip.vehicleType || 'Car'}</div>
                ${trip.weight ? `<div><span class="text-gray-500">Weight:</span> ${trip.weight} kg</div>` : ''}
                ${trip.promoCode ? `<div><span class="text-gray-500">Promo:</span> ${trip.promoCode}</div>` : ''}
                <div><span class="text-gray-500">Distance to dropoff:</span> ${distToDropoff.toFixed(2)} km (${estimateTime(distToDropoff)})</div>
                <div class="flex flex-wrap gap-2">
                    <button id="moveToPickup" class="bg-blue-100 dark:bg-blue-900 px-4 py-1 rounded-full text-sm" ${trip.status==='accepted'?'':'disabled'}>📍 Move to pickup</button>
                    <button id="moveToDropoff" class="bg-blue-100 dark:bg-blue-900 px-4 py-1 rounded-full text-sm" ${trip.status==='pickedUp'?'':'disabled'}>🏁 Move to dropoff</button>
                    <button id="markPicked" class="bg-amber-100 dark:bg-amber-900 px-4 py-1 rounded-full text-sm" ${trip.status==='accepted'?'':'disabled'}>📦 Picked up</button>
                    <button id="markDelivered" class="bg-emerald-100 dark:bg-emerald-900 px-4 py-1 rounded-full text-sm" ${trip.status==='pickedUp'?'':'disabled'}>✅ Delivered</button>
                </div>
                ${chatHtml}
            </div>`;
        document.getElementById('moveToPickup').onclick = async () => { if (trip.pickupLatLng) await updateDriverLoc(trip.pickupLatLng.lat, trip.pickupLatLng.lng); };
        document.getElementById('moveToDropoff').onclick = async () => { if (trip.dropoffLatLng) await updateDriverLoc(trip.dropoffLatLng.lat, trip.dropoffLatLng.lng); };
        document.getElementById('markPicked').onclick = async () => { if (trip.status === 'accepted') { await updateDoc(doc(db,"requests",trip.id),{status:'pickedUp'}); renderDriverTabs(); showNotification('Picked up', `You picked up ${trip.customerName}`); } };
        document.getElementById('markDelivered').onclick = async () => { if (trip.status === 'pickedUp') { await updateDoc(doc(db,"requests",trip.id),{status:'delivered'}); await updateDoc(doc(db,"drivers",currentUser.uid),{activeRequestId:null,status:"online"}); driverData.activeRequestId=null; driverData.status="online"; renderDriverTabs(); showNotification('Delivered', `Trip completed with ${trip.customerName}`); } };
        if (trip.id) loadChat(trip.id, true);
    }

    function renderDriverHistoryTab(container) {
        const my = allRequests.filter(r => r.driverId === currentUser.uid && r.status === 'delivered');
        if (!my.length) { container.innerHTML = '<div class="text-center py-8 text-gray-400">No completed trips</div>'; return; }
        container.innerHTML = my.map(r => {
            const tripDisplay = r.tripNumber ? `#${r.tripNumber}` : `#${r.id.substring(0,6)}`;
            return `<div class="border-b border-gray-100 dark:border-gray-700 py-2 flex justify-between">
                <div><span>${tripDisplay} ${r.type} – ${CURRENCY}${r.price}</span><br><span class="text-xs text-gray-400">📅 ${formatDate(r.createdAt)}</span>${r.vehicleType ? ` • ${r.vehicleType}` : ''}</div>
                <span class="text-sm text-gray-400">${r.customerName}</span>
            </div>`;
        }).join('');
    }

    // ---------- CHAT ----------
    async function loadChat(requestId, showBadge = false) {
        if (chatUnsub) chatUnsub();
        const chatRef = collection(db, "chats", requestId, "messages");
        const q = query(chatRef, orderBy("timestamp"));
        const userId = currentUser.uid;
        let lastRead = null;
        try {
            const readDoc = await getDoc(doc(db, "chatReads", requestId));
            if (readDoc.exists() && readDoc.data()[userId]) {
                lastRead = readDoc.data()[userId].toDate ? readDoc.data()[userId].toDate() : new Date(readDoc.data()[userId]);
            }
        } catch(e) {}
        chatUnsub = onSnapshot(q, (snap) => {
            const messages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const chatDiv = document.getElementById('chatMessages');
            if (chatDiv) {
                chatDiv.innerHTML = messages.map(m => `<div class="chat-message"><b>${m.senderName}:</b> ${m.text} <span class="time">${formatTime(m.timestamp)}</span></div>`).join('');
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }
            if (showBadge && lastRead !== null) {
                const unread = messages.filter(m => {
                    const ts = m.timestamp?.toDate ? m.timestamp.toDate() : new Date(m.timestamp);
                    return ts > lastRead && m.senderId !== userId;
                });
                const badge = document.getElementById('chatBadge');
                if (badge) {
                    if (unread.length > 0) { badge.innerText = unread.length; badge.classList.remove('hidden'); }
                    else { badge.classList.add('hidden'); }
                }
            } else {
                const badge = document.getElementById('chatBadge');
                if (badge) badge.classList.add('hidden');
            }
            // Notify if new message from other party (push notification)
            const lastMsg = messages[messages.length - 1];
            if (lastMsg && lastMsg.senderId !== userId && showBadge) {
                showNotification('New message', `${lastMsg.senderName}: ${lastMsg.text}`);
            }
        });
        const details = document.getElementById('chatDetails');
        if (details) {
            details.addEventListener('toggle', async () => {
                if (details.open) {
                    await setDoc(doc(db, "chatReads", requestId), { [userId]: serverTimestamp() }, { merge: true });
                    const badge = document.getElementById('chatBadge');
                    if (badge) badge.classList.add('hidden');
                }
            });
        }
        const sendBtn = document.getElementById('sendChat');
        const input = document.getElementById('chatInput');
        if (sendBtn && input) {
            const newSend = async () => {
                const text = input.value.trim();
                if (!text) return;
                await addDoc(collection(db, "chats", requestId, "messages"), { senderId: userId, senderName: currentUser.email, text, timestamp: serverTimestamp() });
                input.value = '';
                await setDoc(doc(db, "chatReads", requestId), { [userId]: serverTimestamp() }, { merge: true });
                const badge = document.getElementById('chatBadge');
                if (badge) badge.classList.add('hidden');
            };
            sendBtn.onclick = newSend;
            input.addEventListener('keypress', (e) => { if (e.key === 'Enter') newSend(); });
        }
    }

    // ============================================================
    // =============== ADMIN PANEL (enhanced) =====================
    // ============================================================
    async function renderAdminPanel() {
        const usersSnap=await getDocs(collection(db,"users"));
        const driversSnap=await getDocs(collection(db,"drivers"));
        const requestsSnap=await getDocs(collection(db,"requests"));
        const foodOrdersSnap=await getDocs(collection(db,"foodOrders"));
        
        // Revenue chart data
        const byDay={}; 
        let totalRevenue = 0;
        allRequests.forEach(r=>{
            if (r.status === 'delivered') {
                const d=r.createdAt?.toDate?.()?.toDateString()||'Unknown'; 
                byDay[d]=(byDay[d]||0)+r.price;
                totalRevenue += r.price;
            }
        });
        const topDrivers=[]; 
        for(const d of driversSnap.docs){
            const user=await getDoc(doc(db,"users",d.id)); 
            const email=user.exists()?user.data().email:d.id; 
            const data=d.data(); 
            const driverReqs = allRequests.filter(r => r.driverId === d.id && r.status === 'delivered');
            const earnings = driverReqs.reduce((s,r) => s + r.price, 0);
            topDrivers.push({email, rating:data.averageRating||0, count:data.ratingsCount||0, car:data.carModel||'', plate:data.plate||'', earnings });
        } 
        topDrivers.sort((a,b)=>b.earnings-a.earnings);

        document.getElementById('appContainer').innerHTML=`
            <div class="fade-in">
                ${renderHeader('👑 Admin', 'adminLogout')}
                <div class="grid grid-cols-4 gap-4 mb-4">
                    <div class="card text-center p-3">👥 Users<br><span class="text-2xl font-bold">${usersSnap.size}</span></div>
                    <div class="card text-center p-3">🚚 Drivers<br><span class="text-2xl font-bold">${driversSnap.size}</span></div>
                    <div class="card text-center p-3">📦 Rides<br><span class="text-2xl font-bold">${requestsSnap.size}</span></div>
                    <div class="card text-center p-3">💰 Revenue<br><span class="text-2xl font-bold">${CURRENCY}${totalRevenue.toFixed(2)}</span></div>
                </div>
                <div class="card p-4 mb-4"><h3 class="font-semibold">📈 Revenue per day</h3><canvas id="revenueChart" height="150"></canvas></div>
                <div class="card p-4 mb-4"><h3 class="font-semibold">🏆 Top Drivers (by earnings)</h3><ul>${topDrivers.slice(0,5).map(d=>`<li>${d.email} – ${CURRENCY}${d.earnings.toFixed(2)} ⭐ ${d.rating.toFixed(1)} (${d.count}) – ${d.car} (${d.plate})</li>`).join('')}</ul></div>
                <div class="card p-4 mb-4">
                    <h3 class="font-semibold">📋 Requests</h3>
                    <div class="flex flex-wrap gap-2 mb-2">
                        <button class="filter-btn text-xs bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full" data-filter="all">All</button>
                        <button class="filter-btn text-xs bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full" data-filter="pending">Pending</button>
                        <button class="filter-btn text-xs bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full" data-filter="accepted">Accepted</button>
                        <button class="filter-btn text-xs bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full" data-filter="delivered">Delivered</button>
                        <button class="filter-btn text-xs bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full" data-filter="taxi">🚖 Taxi</button>
                        <button class="filter-btn text-xs bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full" data-filter="delivery">📦 Delivery</button>
                    </div>
                    <div id="adminRequestsList" class="max-h-64 overflow-auto"></div>
                </div>
                <div class="card p-4"><h3 class="font-semibold">👤 User Management</h3><div id="userManagementList"></div></div>
            </div>`;
        document.getElementById('adminLogout').onclick=async()=>{await signOut(auth); currentUser=null; renderLogin();};
        document.getElementById('refreshBtn').onclick=()=>{listenRequests(); Swal.fire({title:'Refreshed!',icon:'success',timer:800});};
        document.getElementById('modeToggle').onclick=()=>{document.body.classList.toggle('light'); localStorage.setItem('lightMode',document.body.classList.contains('light')); renderAdminPanel();};
        
        new Chart(document.getElementById('revenueChart'),{type:'line',data:{labels:Object.keys(byDay),datasets:[{label:'Revenue (ZMW)',data:Object.values(byDay),borderColor:'var(--primary)',fill:false}]}});

        // Filter functionality
        let currentFilter = 'all';
        function renderFilteredRequests() {
            const filtered = currentFilter === 'all' ? allRequests : allRequests.filter(r => {
                if (currentFilter === 'taxi' || currentFilter === 'delivery') return r.type === currentFilter;
                return r.status === currentFilter;
            });
            document.getElementById('adminRequestsList').innerHTML = filtered.map(r => {
                const td = r.tripNumber ? `#${r.tripNumber}` : `#${r.id.substring(0,6)}`;
                return `<div class="border-b py-1 text-sm flex justify-between items-center">
                    <span>${td} ${r.type} – ${r.status} – ${CURRENCY}${r.price}${r.promoCode ? ` ✨${r.promoCode}` : ''}</span>
                    <span class="text-xs text-gray-400">${r.customerName}</span>
                </div>`;
            }).join('');
        }
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentFilter = btn.dataset.filter;
                renderFilteredRequests();
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('bg-primary-light'));
                btn.classList.add('bg-primary-light');
            });
        });
        renderFilteredRequests();

        // User management
        const userMgmt=document.getElementById('userManagementList');
        const allUsers=await getDocs(collection(db,"users"));
        userMgmt.innerHTML='';
        for(const u of allUsers.docs){const data=u.data(); 
            const isDriver = data.role === 'driver';
            const driverEarnings = isDriver ? allRequests.filter(r => r.driverId === u.id && r.status === 'delivered').reduce((s,r) => s + r.price, 0) : 0;
            userMgmt.innerHTML+=`<div class="border-b py-1 flex justify-between items-center flex-wrap"><span>${data.email} (${data.role})${isDriver ? ` 💰${CURRENCY}${driverEarnings.toFixed(2)}` : ''}</span><div><button class="suspendBtn text-red-500 text-xs" data-uid="${u.id}">Suspend</button> <button class="resetBtn text-blue-500 text-xs" data-email="${data.email}">Reset</button></div></div>`;
        }
        document.querySelectorAll('.suspendBtn').forEach(b=>b.addEventListener('click',()=>Swal.fire('Demo','Suspend action (simulated)','info')));
        document.querySelectorAll('.resetBtn').forEach(b=>b.addEventListener('click',()=>Swal.fire('Demo','Reset password email (simulated)','info')));
    }

    // ---------- BOOT ----------
    onAuthStateChanged(auth, async (user) => {
        if (user) { currentUser = user; await loadUserData(currentUser.uid); await initNotifications(); startApp(); }
        else renderLogin();
    });
</script>
