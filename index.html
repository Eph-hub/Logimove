<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LogiMove Zambia - Professional Logistics</title>
    <!-- Favicon (base64 emoji fallback) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚚</text></svg>">
    <!-- Tailwind + Font Awesome + Chart.js + Leaflet + SweetAlert2 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Dark mode variables */
        :root { --bg: #f1f5f9; --card: white; --text: #0f172a; --border: #e2e8f0; }
        body.dark { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: #334155; }
        body { background-color: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
        .card-bg { background-color: var(--card); border-color: var(--border); }
        .map-container { height: 240px; width: 100%; border-radius: 16px; margin-bottom: 10px; }
        .saved-place-item { background: #f1f5f9; border-radius: 20px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer; display: inline-block; margin: 2px; }
        button:active { transform: scale(0.97); }
        .location-card { background: #f8fafc; border-radius: 1rem; padding: 0.75rem; margin-bottom: 0.75rem; }
        body.dark .location-card { background: #334155; }
        .star-rating { color: gray; cursor: pointer; font-size: 1.2rem; }
        .star-rating.active { color: gold; }
        /* Smooth transitions */
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom spinner */
        .spinner { border: 3px solid rgba(0,0,0,0.1); border-top-color: #10b981; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 font-sans antialiased">
    <div id="appContainer" class="max-w-7xl mx-auto p-4">Loading...</div>

    <script type="module">
        // ---------- FIREBASE IMPORTS (keep as is) ----------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, query, orderBy, addDoc, serverTimestamp, deleteDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5hxpRq8WJ5f6EmNZPw-3II6910CXk4Z4",
            authDomain: "logimove-zambia.firebaseapp.com",
            projectId: "logimove-zambia",
            storageBucket: "logimove-zambia.firebasestorage.app",
            messagingSenderId: "136025058262",
            appId: "1:136025058262:web:821a7533b7b3e1b1b91277"
        };
        const VAPID_KEY = "BA9DpLjj3iXB42GTsGrmu_Cv41BubNylrMcLYmnBBXTi4ib5pSUl46-tkskKk35URzS6-1NlYDA13fNGNTcBJVI";
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const messaging = getMessaging(app);

        // ---------- GLOBALS ----------
        let currentUser = null, currentRole = null;
        let tempPickup = null, tempDropoff = null;
        let serviceType = "delivery";
        let customerMap, driverMap;
        let pickupMarker, dropoffMarker, driverMarker;
        let savedPlaces = [];
        let allRequests = [];
        let unsubscribeRequests = null;
        let driverData = { currentLat: -15.3875, currentLng: 28.3228, status: "online", activeRequestId: null };
        let mapSelectMode = "pickup";
        let fcmToken = null;
        let chatUnsub = null;

        // Pricing & currency
        const RATES = { taxi: { base: 25, perKm: 10 }, delivery: { base: 30, perKm: 12 } };
        const CURRENCY = "K";
        const PAYMENT_METHODS = ["Cash on Delivery", "Airtel Money", "MTN Money", "Zamtel Pay", "Card"];
        let surgeMultiplier = 1.0; // can be dynamic later

        // Dark mode
        if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');
        function toggleDarkMode() { document.body.classList.toggle('dark'); localStorage.setItem('darkMode', document.body.classList.contains('dark')); }

        // Helpers
        function haversine(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
        function autoPrice() {
            if (!tempPickup || !tempDropoff) return 0;
            const dist = haversine(tempPickup.lat, tempPickup.lng, tempDropoff.lat, tempDropoff.lng);
            let price = RATES[serviceType].base + dist * RATES[serviceType].perKm;
            price = price * surgeMultiplier;
            const rounded = Math.round(price * 2) / 2;
            const priceInput = document.getElementById('priceInput');
            if (priceInput) priceInput.value = rounded;
            const distSpan = document.getElementById('distanceDisplay');
            if (distSpan) distSpan.innerText = dist.toFixed(2) + " km";
            const autoSpan = document.getElementById('autoPriceDisplay');
            if (autoSpan) autoSpan.innerText = `${CURRENCY}${rounded}`;
            const breakdownSpan = document.getElementById('fareBreakdown');
            if (breakdownSpan) breakdownSpan.innerHTML = `Base: ${CURRENCY}${RATES[serviceType].base} + ${RATES[serviceType].perKm} × ${dist.toFixed(2)}km = ${CURRENCY}${rounded}`;
            return rounded;
        }

        // Notifications
        async function initNotifications() {
            if (fcmToken) return;
            try {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') return;
                const token = await getToken(messaging, { vapidKey: VAPID_KEY });
                if (token && currentUser) await setDoc(doc(db, "fcmTokens", currentUser.uid), { token, role: currentRole }, { merge: true });
                fcmToken = token;
            } catch(e) { console.warn("FCM error", e); }
        }
        function showNotification(title, body) {
            if (Notification.permission === 'granted') new Notification(title, { body, icon: 'https://via.placeholder.com/64?text=LM' });
            else Swal.fire({ title, text: body, icon: 'info', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
        }
        onMessage(messaging, (payload) => showNotification(payload.notification.title, payload.notification.body));

        // Ratings
        async function rateDriver(requestId, driverId, rating, comment) {
            await setDoc(doc(db, "ratings", requestId), { driverId, rating, comment, timestamp: serverTimestamp(), requestId });
            const ratingsSnap = await getDocs(query(collection(db, "ratings"), where("driverId", "==", driverId)));
            let total = 0, count = 0;
            ratingsSnap.forEach(d => { total += d.data().rating; count++; });
            const avg = total / count;
            await updateDoc(doc(db, "drivers", driverId), { averageRating: avg, ratingsCount: count });
            Swal.fire({ title: 'Thank you!', text: 'Rating submitted', icon: 'success', timer: 1500, showConfirmButton: false });
        }

        // ---------- AUTH & LOAD ----------
        async function saveUserToFirestore(user, role, name) {
            await setDoc(doc(db, "users", user.uid), { email: user.email, name, role, createdAt: serverTimestamp() });
            if (role === 'driver') {
                await setDoc(doc(db, "drivers", user.uid), { currentLat: -15.3875, currentLng: 28.3228, status: "online", activeRequestId: null, averageRating: 0, ratingsCount: 0 });
            }
        }
        async function loadUserData(uid) {
            const userSnap = await getDoc(doc(db, "users", uid));
            if (userSnap.exists()) currentRole = userSnap.data().role;
            if (currentRole === "driver") {
                const drvSnap = await getDoc(doc(db, "drivers", uid));
                if (drvSnap.exists()) driverData = drvSnap.data();
                else await setDoc(doc(db, "drivers", uid), driverData);
            }
            const savedSnap = await getDoc(doc(db, "savedPlaces", uid));
            savedPlaces = savedSnap.exists() ? savedSnap.data().places || [] : [];
        }
        function listenRequests() {
            if (unsubscribeRequests) unsubscribeRequests();
            const q = query(collection(db, "requests"), orderBy("createdAt", "desc"));
            unsubscribeRequests = onSnapshot(q, (snap) => {
                allRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (currentRole === "customer") refreshCustomerUI();
                else if (currentRole === "driver") refreshDriverUI();
                else if (currentRole === "admin") renderAdminPanel();
            });
        }

        // ------------------------------ LOGIN & REGISTRATION (separate choices) ------------------------------
        function renderLogin() {
            document.getElementById('appContainer').innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-md p-6 transition-all fade-in">
                        <div class="text-center">
                            <div class="bg-green-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto"><i class="fas fa-truck-fast text-white text-3xl"></i></div>
                            <h1 class="text-2xl font-bold mt-3 dark:text-white">Logi<span class="text-green-600">Move</span> Zambia</h1>
                            <p class="text-sm text-slate-500 dark:text-gray-300">Delivery & Taxi • ZMW</p>
                        </div>
                        <div class="mt-6 space-y-3">
                            <input type="email" id="loginEmail" placeholder="Email" class="w-full border rounded-xl p-2 dark:bg-gray-700 dark:text-white">
                            <input type="password" id="loginPassword" placeholder="Password" class="w-full border rounded-xl p-2 dark:bg-gray-700 dark:text-white">
                            <button id="loginBtn" class="w-full bg-green-600 text-white py-2 rounded-xl hover:bg-green-700">Login</button>
                        </div>
                        <div class="mt-4 border-t pt-4 dark:border-gray-600">
                            <div class="flex gap-3 text-sm">
                                <button id="showCustomerReg" class="flex-1 bg-green-50 dark:bg-green-900 text-green-600 dark:text-green-300 py-1 rounded-full">➕ New Customer</button>
                                <button id="showDriverReg" class="flex-1 bg-amber-50 dark:bg-amber-900 text-amber-600 dark:text-amber-300 py-1 rounded-full">🚚 New Driver</button>
                            </div>
                            <div id="customerRegForm" class="hidden mt-3 space-y-2">
                                <input type="text" id="custName" placeholder="Full name" class="w-full border rounded-lg p-2 dark:bg-gray-700">
                                <input type="email" id="custEmail" placeholder="Email" class="w-full border rounded-lg p-2 dark:bg-gray-700">
                                <input type="password" id="custPwd" placeholder="Password" class="w-full border rounded-lg p-2 dark:bg-gray-700">
                                <button id="doCustomerReg" class="w-full bg-green-500 text-white py-1 rounded-lg">Register as Customer</button>
                            </div>
                            <div id="driverRegForm" class="hidden mt-3 space-y-2">
                                <input type="text" id="drvName" placeholder="Full name" class="w-full border rounded-lg p-2 dark:bg-gray-700">
                                <input type="email" id="drvEmail" placeholder="Email" class="w-full border rounded-lg p-2 dark:bg-gray-700">
                                <input type="password" id="drvPwd" placeholder="Password" class="w-full border rounded-lg p-2 dark:bg-gray-700">
                                <button id="doDriverReg" class="w-full bg-amber-500 text-white py-1 rounded-lg">Register as Driver</button>
                            </div>
                        </div>
                        <div class="mt-3 text-center text-xs text-slate-400 dark:text-gray-400">
                            <button id="darkModeToggle" class="underline">🌓 Dark Mode</button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('loginBtn').onclick = async () => {
                const email = document.getElementById('loginEmail').value.trim();
                const pwd = document.getElementById('loginPassword').value;
                try {
                    const cred = await signInWithEmailAndPassword(auth, email, pwd);
                    currentUser = cred.user;
                    await loadUserData(currentUser.uid);
                    await initNotifications();
                    startApp();
                } catch(e) { Swal.fire('Login error', e.message, 'error'); }
            };
            const showCust = () => { document.getElementById('customerRegForm').classList.remove('hidden'); document.getElementById('driverRegForm').classList.add('hidden'); };
            const showDrv = () => { document.getElementById('driverRegForm').classList.remove('hidden'); document.getElementById('customerRegForm').classList.add('hidden'); };
            document.getElementById('showCustomerReg').onclick = showCust;
            document.getElementById('showDriverReg').onclick = showDrv;
            document.getElementById('doCustomerReg').onclick = async () => {
                const name = document.getElementById('custName').value.trim();
                const email = document.getElementById('custEmail').value.trim();
                const pwd = document.getElementById('custPwd').value;
                if (!name || !email || !pwd) return Swal.fire('All fields required');
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
                    await saveUserToFirestore(cred.user, 'customer', name);
                    currentUser = cred.user;
                    await loadUserData(currentUser.uid);
                    await initNotifications();
                    startApp();
                } catch(e) { Swal.fire('Registration error', e.message, 'error'); }
            };
            document.getElementById('doDriverReg').onclick = async () => {
                const name = document.getElementById('drvName').value.trim();
                const email = document.getElementById('drvEmail').value.trim();
                const pwd = document.getElementById('drvPwd').value;
                if (!name || !email || !pwd) return Swal.fire('All fields required');
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
                    await saveUserToFirestore(cred.user, 'driver', name);
                    currentUser = cred.user;
                    await loadUserData(currentUser.uid);
                    await initNotifications();
                    startApp();
                } catch(e) { Swal.fire('Registration error', e.message, 'error'); }
            };
            document.getElementById('darkModeToggle').onclick = () => toggleDarkMode();
        }

        // ------------------------------ ONBOARDING TOUR (simple) ------------------------------
        let tourShown = false;
        function startOnboarding(role) {
            if (tourShown) return;
            tourShown = true;
            const steps = role === 'customer' ? [
                { title: '📍 Set Pickup', text: 'Click "Set on map" then click anywhere on the map to set your pickup location.' },
                { title: '🏁 Set Dropoff', text: 'Switch to dropoff mode and click the map for destination.' },
                { title: '💰 Price & Publish', text: 'Distance and price auto‑calculate. You can edit the price, then publish your request.' }
            ] : [
                { title: '📋 Available Requests', text: 'See all open trips here. Accept one to start.' },
                { title: '📍 Move to Pickup', text: 'Use "Move to pickup" button to simulate arrival.' },
                { title: '📦 Complete Trip', text: 'Press "Picked up" then "Delivered" to finish and get paid.' }
            ];
            let i = 0;
            function showStep() {
                if (i >= steps.length) return;
                Swal.fire({ title: steps[i].title, text: steps[i].text, icon: 'info', confirmButtonText: 'Next', allowOutsideClick: false }).then(() => { i++; showStep(); });
            }
            showStep();
        }

        // ------------------------------ CUSTOMER DASHBOARD (enhanced) ------------------------------
        function renderCustomerDashboard() {
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold dark:text-white">👤 ${currentUser.email}</h2><div><button id="darkModeToggle2" class="px-2 py-1 rounded bg-gray-200 dark:bg-gray-700">🌓</button><button id="logoutBtn" class="ml-2 bg-red-100 text-red-600 px-3 py-1 rounded">Logout</button></div></div>
                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-5">
                        <div class="flex gap-2"><button id="serviceDelivery" class="px-3 py-1 rounded-full ${serviceType==='delivery'?'bg-green-600 text-white':'bg-gray-200 dark:bg-gray-700'}">📦 Delivery</button><button id="serviceTaxi" class="px-3 py-1 rounded-full ${serviceType==='taxi'?'bg-green-600 text-white':'bg-gray-200 dark:bg-gray-700'}">🚖 Taxi</button></div>
                        <div class="relative mt-3"><input type="text" id="searchInput" placeholder="Search Zambia address..." class="w-full border rounded-xl p-2 dark:bg-gray-700"><div id="searchResults" class="absolute bg-white dark:bg-gray-800 border rounded-xl hidden z-10 w-full"></div></div>
                        <div class="flex gap-1 my-2"><button id="setPickupSearch" class="text-xs bg-indigo-100 dark:bg-indigo-900 px-2 py-1 rounded">📍 Set as pickup</button><button id="setDropoffSearch" class="text-xs bg-emerald-100 dark:bg-emerald-900 px-2 py-1 rounded">🏁 Set as dropoff</button><button id="saveLocationBtn" class="text-xs bg-amber-100 dark:bg-amber-900 px-2 py-1 rounded">💾 Save location</button></div>
                        <div id="savedPlacesList" class="flex flex-wrap gap-1 my-2"></div>
                        <div class="location-card"><div class="flex justify-between"><b>📍 PICKUP</b><button id="pickupMapMode" class="text-xs bg-indigo-100 px-2 rounded">Set on map</button></div><div id="pickupCoord">Not set</div><button id="clearPickup" class="text-xs text-red-500">Clear</button></div>
                        <div class="location-card"><div class="flex justify-between"><b>🏁 DROPOFF</b><button id="dropoffMapMode" class="text-xs bg-emerald-100 px-2 rounded">Set on map</button></div><div id="dropoffCoord">Not set</div><button id="clearDropoff" class="text-xs text-red-500">Clear</button></div>
                        <div id="customerMap" class="map-container"></div>
                        <div class="bg-green-50 dark:bg-green-900 p-2 rounded text-sm"><div>📏 Distance: <span id="distanceDisplay">— km</span></div><div>💰 Auto price: <span id="autoPriceDisplay">—</span></div><div id="fareBreakdown" class="text-xs"></div></div>
                        <div class="grid grid-cols-2 gap-2 mt-2"><select id="cargoSelect" class="border rounded p-1 dark:bg-gray-700">${serviceType==='delivery'?'<option>Package</option><option>Box</option><option>Furniture</option>':'<option>1 passenger</option><option>2 passengers</option><option>3 passengers</option><option>4 passengers</option>'}</select><input type="number" id="priceInput" step="0.5" placeholder="Price (ZMW)" class="border rounded p-1 dark:bg-gray-700"><select id="paymentSelect" class="border rounded p-1 col-span-2 dark:bg-gray-700">${PAYMENT_METHODS.map(p=>`<option>${p}</option>`).join('')}</select></div>
                        <button id="publishBtn" class="w-full mt-3 bg-green-600 text-white py-2 rounded-xl hover:bg-green-700">Publish Request</button>
                    </div>
                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-5 mt-4"><h3 class="font-bold">Your active request</h3><div id="activeCard">None</div><details><summary>📜 Past requests</summary><div id="historyList" class="max-h-48 overflow-auto"></div></details></div>
                </div>`;
            initCustomerMap();
            attachCustomerEvents();
            refreshCustomerUI();
            renderSavedPlaces();
            if (tempPickup && tempDropoff) autoPrice();
            // Onboarding
            startOnboarding('customer');
            document.getElementById('darkModeToggle2').onclick = () => toggleDarkMode();
        }

        function initCustomerMap() {
            if (customerMap) customerMap.remove();
            customerMap = L.map('customerMap').setView([-15.3875, 28.3228], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(customerMap);
            customerMap.on('click', (e) => {
                if (mapSelectMode === 'pickup') { tempPickup = e.latlng; updatePickupDropoffDisplay(); autoPrice(); }
                else if (mapSelectMode === 'dropoff') { tempDropoff = e.latlng; updatePickupDropoffDisplay(); autoPrice(); }
            });
            if (tempPickup) pickupMarker = L.marker([tempPickup.lat, tempPickup.lng]).addTo(customerMap).bindTooltip('Pickup');
            if (tempDropoff) dropoffMarker = L.marker([tempDropoff.lat, tempDropoff.lng]).addTo(customerMap).bindTooltip('Dropoff');
            window.customerMap = customerMap;
        }

        function updatePickupDropoffDisplay() {
            document.getElementById('pickupCoord').innerHTML = tempPickup ? `${tempPickup.lat.toFixed(5)}, ${tempPickup.lng.toFixed(5)}` : 'Not set';
            document.getElementById('dropoffCoord').innerHTML = tempDropoff ? `${tempDropoff.lat.toFixed(5)}, ${tempDropoff.lng.toFixed(5)}` : 'Not set';
            if (customerMap) {
                if (pickupMarker) customerMap.removeLayer(pickupMarker);
                if (dropoffMarker) customerMap.removeLayer(dropoffMarker);
                if (tempPickup) pickupMarker = L.marker([tempPickup.lat, tempPickup.lng]).addTo(customerMap);
                if (tempDropoff) dropoffMarker = L.marker([tempDropoff.lat, tempDropoff.lng]).addTo(customerMap);
            }
        }

        async function renderSavedPlaces() {
            const container = document.getElementById('savedPlacesList');
            if (!container) return;
            if (!savedPlaces.length) { container.innerHTML = '<span class="text-xs">No saved places</span>'; return; }
            container.innerHTML = savedPlaces.map(p => `<div class="saved-place-item" data-lat="${p.lat}" data-lng="${p.lng}" data-name="${p.name}"><i class="fas fa-map-pin"></i> ${escapeHtml(p.name)} <i class="fas fa-trash-alt text-red-400 delete-place" data-name="${p.name}" style="cursor:pointer"></i></div>`).join('');
            document.querySelectorAll('.saved-place-item').forEach(el => {
                const lat = parseFloat(el.dataset.lat), lng = parseFloat(el.dataset.lng), name = el.dataset.name;
                el.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-place')) return;
                    if (mapSelectMode === 'pickup') { tempPickup = { lat, lng }; updatePickupDropoffDisplay(); autoPrice(); }
                    else { tempDropoff = { lat, lng }; updatePickupDropoffDisplay(); autoPrice(); }
                });
                const del = el.querySelector('.delete-place');
                if (del) del.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    savedPlaces = savedPlaces.filter(p => p.name !== name);
                    await setDoc(doc(db, "savedPlaces", currentUser.uid), { places: savedPlaces });
                    renderSavedPlaces();
                });
            });
        }

        async function searchAddress(query) {
            if (query.length < 3) return [];
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&countrycodes=zm`;
            try { const res = await fetch(url); const data = await res.json(); return data.map(i => ({ lat: parseFloat(i.lat), lng: parseFloat(i.lon), display_name: i.display_name })); } catch(e) { return []; }
        }

        let lastSearchLoc = null;
        async function attachCustomerEvents() {
            document.getElementById('serviceDelivery').onclick = () => { serviceType = 'delivery'; renderCustomerDashboard(); };
            document.getElementById('serviceTaxi').onclick = () => { serviceType = 'taxi'; renderCustomerDashboard(); };
            document.getElementById('pickupMapMode').onclick = () => { mapSelectMode = 'pickup'; Swal.fire({ title: 'Pickup mode', text: 'Click on map to set pickup', icon: 'info', timer: 1500, showConfirmButton: false }); };
            document.getElementById('dropoffMapMode').onclick = () => { mapSelectMode = 'dropoff'; Swal.fire({ title: 'Dropoff mode', text: 'Click on map to set dropoff', icon: 'info', timer: 1500, showConfirmButton: false }); };
            document.getElementById('clearPickup').onclick = () => { tempPickup = null; updatePickupDropoffDisplay(); autoPrice(); };
            document.getElementById('clearDropoff').onclick = () => { tempDropoff = null; updatePickupDropoffDisplay(); autoPrice(); };

            document.getElementById('setDropoffSearch').onclick = () => { if (lastSearchLoc) { tempDropoff = { lat: lastSearchLoc.lat, lng: lastSearchLoc.lng }; updatePickupDropoffDisplay(); autoPrice(); } else Swal.fire('Search first'); };
            document.getElementById('saveLocationBtn').onclick = async () => {

                if (!name) return;

        function refreshCustomerUI() {
            const my = allRequests.filter(r => r.customerId === currentUser.uid);
            const active = my.find(r => ['pending','accepted','pickedUp'].includes(r.status));
            const cardDiv = document.getElementById('activeCard');
            if (!active) cardDiv.innerHTML = '<p>No active request</p>';
            else {
                let ratingHtml = '';
                if (active.status === 'delivered' && !active.rated) {
                    ratingHtml = `<div class="mt-2"><span>Rate driver: </span><span class="star-rating" data-rating="1">★</span><span class="star-rating" data-rating="2">★</span><span class="star-rating" data-rating="3">★</span><span class="star-rating" data-rating="4">★</span><span class="star-rating" data-rating="5">★</span><input type="text" id="ratingComment" placeholder="Comment (optional)" class="border rounded p-1 text-xs w-full mt-1 dark:bg-gray-700"><button id="submitRating" class="bg-blue-500 text-white text-xs p-1 rounded mt-1">Submit Rating</button></div>`;
                }
                cardDiv.innerHTML = `<div class="bg-slate-100 dark:bg-gray-700 p-2 rounded">#${active.id.substring(0,6)} ${active.type} - ${active.cargoDetail}<br/>Status: ${active.status}<br/>Price: ${CURRENCY}${active.price}<br/>Payment: ${active.paymentMethod}<br/>${active.driverName ? `Driver: ${active.driverName}` : 'Waiting...'}${ratingHtml}</div>`;
                if (active.status === 'delivered' && !active.rated) {
                    const stars = document.querySelectorAll('.star-rating');
                    let selectedRating = 0;
                    stars.forEach(star => {
                        star.addEventListener('click', () => { selectedRating = parseInt(star.dataset.rating); stars.forEach(s => s.style.color = (parseInt(s.dataset.rating) <= selectedRating) ? 'gold' : 'gray'); });
                    });
                    document.getElementById('submitRating').onclick = async () => {
                        if (!selectedRating) return Swal.fire('Select a rating');
                        const comment = document.getElementById('ratingComment').value;
                        await rateDriver(active.id, active.driverId, selectedRating, comment);
                        await updateDoc(doc(db, "requests", active.id), { rated: true });
                        refreshCustomerUI();
                    };
                }
            }
            const past = my.filter(r => r.status === 'delivered');
            document.getElementById('historyList').innerHTML = past.length ? past.map(r => `<div class="border-b p-1">#${r.id.substring(0,6)} ${r.type} - ${CURRENCY}${r.price} ${r.rated ? '⭐ Rated' : ''} <button class="text-blue-500 text-xs view-trip" data-id="${r.id}">View map</button></div>`).join('') : '<div>No past trips</div>';
            document.querySelectorAll('.view-trip').forEach(btn => btn.addEventListener('click', (e) => {
                const tripId = btn.dataset.id;
                const trip = allRequests.find(r => r.id === tripId);
                if (trip && trip.pickupLatLng && trip.dropoffLatLng) {
                    Swal.fire({
                        title: 'Trip route',
                        html: `<div id="miniMap" style="height:200px;"></div>`,
                        didOpen: () => {
                            const map = L.map('miniMap').setView([trip.pickupLatLng.lat, trip.pickupLatLng.lng], 12);
                            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
                            L.marker([trip.pickupLatLng.lat, trip.pickupLatLng.lng]).addTo(map).bindTooltip('Pickup');
                            L.marker([trip.dropoffLatLng.lat, trip.dropoffLatLng.lng]).addTo(map).bindTooltip('Dropoff');
                            L.polyline([[trip.pickupLatLng.lat, trip.pickupLatLng.lng], [trip.dropoffLatLng.lat, trip.dropoffLatLng.lng]], {color: 'blue'}).addTo(map);
                        }
                    });
                }
            }));
            // Driver tracking
            const activeTrip = my.find(r => r.driverId && (r.status === 'accepted' || r.status === 'pickedUp'));
            if (activeTrip && activeTrip.driverId) {
                if (window.driverPosUnsub) window.driverPosUnsub();
                window.driverPosUnsub = onSnapshot(doc(db, "drivers", activeTrip.driverId), (docSnap) => {
                    if (docSnap.exists() && window.customerMap) {
                        const loc = docSnap.data();
                        if (window.driverMarkerCust) window.driverMarkerCust.setLatLng([loc.currentLat, loc.currentLng]);
                        else window.driverMarkerCust = L.marker([loc.currentLat, loc.currentLng], { icon: L.divIcon({ html: '<i class="fas fa-truck-fast text-indigo-700"></i>', iconSize: [24,24] }) }).addTo(window.customerMap).bindTooltip('Driver');
                        // ETA estimation
                        if (activeTrip.dropoffLatLng) {
                            const distToDropoff = haversine(loc.currentLat, loc.currentLng, activeTrip.dropoffLatLng.lat, activeTrip.dropoffLatLng.lng);
                            const etaMinutes = Math.round(distToDropoff / 30 * 60); // assume 30 km/h avg
                            window.driverMarkerCust.bindTooltip(`Driver · ETA ~${etaMinutes} min`).openTooltip();
                        }
                    }
                });
            }
        }

        function initDriverMap() {
            if (driverMap) driverMap.remove();
            driverMap = L.map('driverMap').setView([driverData.currentLat, driverData.currentLng], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(driverMap);
            driverMarker = L.marker([driverData.currentLat, driverData.currentLng], { icon: L.divIcon({ html: '<i class="fas fa-motorcycle text-amber-600 text-2xl"></i>', iconSize: [24,24] }) }).addTo(driverMap);
            window.driverMap = driverMap;
        }

        async function updateDriverLoc(lat, lng) {
            driverData.currentLat = lat;
            driverData.currentLng = lng;
            await updateDoc(doc(db, "drivers", currentUser.uid), { currentLat: lat, currentLng: lng });
            driverMarker.setLatLng([lat, lng]);
            driverMap.setView([lat, lng], 13);
            refreshDriverUI();
        }

        async function attachDriverEvents() {
            document.getElementById('logoutDriver').onclick = async () => { await signOut(auth); currentUser = null; renderLogin(); };
            document.getElementById('gpsBtn').onclick = () => { if (navigator.geolocation) navigator.geolocation.getCurrentPosition(pos => updateDriverLoc(pos.coords.latitude, pos.coords.longitude)); };
            document.getElementById('centerDriverMap').onclick = () => driverMap.setView([driverData.currentLat, driverData.currentLng], 14);
            document.getElementById('moveToPickup').onclick = async () => {
                if (driverData.activeRequestId) {
                    const trip = allRequests.find(r => r.id === driverData.activeRequestId);
                    if (trip) await updateDriverLoc(trip.pickupLatLng.lat, trip.pickupLatLng.lng);
                }
            };
            document.getElementById('moveToDropoff').onclick = async () => {
                if (driverData.activeRequestId) {
                    const trip = allRequests.find(r => r.id === driverData.activeRequestId);
                    if (trip) await updateDriverLoc(trip.dropoffLatLng.lat, trip.dropoffLatLng.lng);
                }
            };
            document.getElementById('markPicked').onclick = async () => {
                if (driverData.activeRequestId) {
                    const trip = allRequests.find(r => r.id === driverData.activeRequestId);
                    if (trip && trip.status === 'accepted') {
                        await updateDoc(doc(db, "requests", driverData.activeRequestId), { status: 'pickedUp' });
                        showNotification("Trip Update", `You picked up ${trip.customerName}.`);
                    }
                }
            };
            document.getElementById('markDelivered').onclick = async () => {
                if (driverData.activeRequestId) {
                    const trip = allRequests.find(r => r.id === driverData.activeRequestId);
                    if (trip && trip.status === 'pickedUp') {
                        await updateDoc(doc(db, "requests", driverData.activeRequestId), { status: 'delivered' });
                        await updateDoc(doc(db, "drivers", currentUser.uid), { activeRequestId: null, status: "online" });
                        driverData.activeRequestId = null;
                        driverData.status = "online";
                        refreshDriverUI();
                        showNotification("Trip Completed", `You delivered to ${trip.customerName}. Thank you!`);
                    }
                }
            };
        }

        function refreshDriverUI() {
            const pending = allRequests.filter(r => r.status === 'pending');
            const availDiv = document.getElementById('availableList');
            availDiv.innerHTML = pending.length ? pending.map(req => `
                <div class="border p-2 rounded mb-2"><div><b>${req.type==='taxi'?'🚖 Taxi':'📦 Delivery'}</b> ${CURRENCY}${req.price}</div><div class="text-xs">${req.customerName} | ${req.cargoDetail}</div><button class="acceptReq bg-amber-500 text-white px-2 py-1 rounded text-xs mt-1" data-id="${req.id}">Accept</button></div>
            `).join('') : '<div>No requests</div>';
            document.querySelectorAll('.acceptReq').forEach(btn => btn.addEventListener('click', async (e) => {
                const reqId = btn.dataset.id;
                const req = allRequests.find(r => r.id === reqId);
                if (req && req.status === 'pending' && driverData.status !== 'busy') {
                    await updateDoc(doc(db, "requests", reqId), { status: 'accepted', driverId: currentUser.uid, driverName: currentUser.email });
                    await updateDoc(doc(db, "drivers", currentUser.uid), { activeRequestId: reqId, status: "busy" });
                    driverData.activeRequestId = reqId;
                    driverData.status = "busy";
                    refreshDriverUI();
                    showNotification("Request Accepted", `You accepted ${req.type} request from ${req.customerName}.`);
                } else Swal.fire('Cannot accept', 'Already busy or request taken', 'warning');
            }));
            const activeId = driverData.activeRequestId;
            const tripDiv = document.getElementById('activeTripDiv');
            if (!activeId) tripDiv.innerHTML = '<p>No active trip</p>';
            else {
                const trip = allRequests.find(r => r.id === activeId);
                tripDiv.innerHTML = trip ? `<div class="bg-amber-50 dark:bg-amber-900 p-2 rounded">Trip #${trip.id.substring(0,6)} (${trip.type}) - ${trip.cargoDetail}<br/>Price: ${CURRENCY}${trip.price}<br/>Payment: ${trip.paymentMethod}<br/>Status: ${trip.status}</div>` : '<p>Loading...</p>';
                const dropoffDiv = document.getElementById('dropoffInfo');
                if (trip && trip.dropoffLatLng) {
                    dropoffDiv.classList.remove('hidden');
                    document.getElementById('dropoffCoordDriver').innerText = `${trip.dropoffLatLng.lat.toFixed(5)}, ${trip.dropoffLatLng.lng.toFixed(5)}`;
                    const dist = haversine(driverData.currentLat, driverData.currentLng, trip.dropoffLatLng.lat, trip.dropoffLatLng.lng);
                    document.getElementById('distToDropoff').innerHTML = `Distance: ${dist.toFixed(2)} km (ETA ~${Math.round(dist/30*60)} min)`;
                } else dropoffDiv.classList.add('hidden');
                // Chat UI
                const chatPanel = document.getElementById('chatPanel');
                const noChat = document.getElementById('noActiveChat');
                if (chatPanel && noChat) {
                    chatPanel.classList.remove('hidden');
                    noChat.classList.add('hidden');
                    loadChat(activeId);
                }
            }
            const movePick = document.getElementById('moveToPickup'), moveDrop = document.getElementById('moveToDropoff'), pickBtn = document.getElementById('markPicked'), delBtn = document.getElementById('markDelivered');
            if (activeId) {
                const trip = allRequests.find(r => r.id === activeId);
                if (trip) { movePick.disabled = false; moveDrop.disabled = false; pickBtn.disabled = (trip.status !== 'accepted'); delBtn.disabled = (trip.status !== 'pickedUp'); }
                else disableAll();
            } else disableAll();
            function disableAll() { movePick.disabled = true; moveDrop.disabled = true; pickBtn.disabled = true; delBtn.disabled = true; }
            document.getElementById('driverStatusBadge').innerText = driverData.status;
            document.getElementById('avgRating').innerText = driverData.averageRating?.toFixed(1) || 'N/A';
            const myCompleted = allRequests.filter(r => r.driverId === currentUser.uid && r.status === 'delivered');
            const historyDiv = document.getElementById('driverHistoryList');
            historyDiv.innerHTML = myCompleted.length ? myCompleted.map(r => `<div class="border-b p-1 text-sm">#${r.id.substring(0,6)} ${r.type} - ${CURRENCY}${r.price} | ${r.customerName} ${r.rated ? '⭐ Rated' : ''}</div>`).join('') : '<div>No completed trips yet</div>';
        }

        // Chat system
        async function loadChat(requestId) {
            if (chatUnsub) chatUnsub();
            const chatRef = collection(db, "chats", requestId, "messages");
            const q = query(chatRef, orderBy("timestamp"));
            chatUnsub = onSnapshot(q, (snap) => {
                const messages = snap.docs.map(d => d.data());
                const chatDiv = document.getElementById('chatMessages');
                if (chatDiv) chatDiv.innerHTML = messages.map(m => `<div><b>${m.senderName}:</b> ${m.text}</div>`).join('');
            });
            const sendBtn = document.getElementById('sendChat');
            const input = document.getElementById('chatInput');
            if (sendBtn && input) {
                sendBtn.onclick = async () => {
                    const text = input.value.trim();
                    if (!text) return;
                    await addDoc(collection(db, "chats", requestId, "messages"), {
                        senderId: currentUser.uid,
                        senderName: currentUser.email,
                        text,
                        timestamp: serverTimestamp()
                    });
                    input.value = '';
                };
            }
        }

                const headers = ['ID','Type','Status','Price (ZMW)','Customer','Driver','Payment','Created'];
                const rows = allRequests.map(r => [r.id, r.type, r.status, r.price, r.customerName, r.driverName || '', r.paymentMethod, r.createdAt?.toDate?.()?.toISOString() || '']);
                const csv = [headers, ...rows].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
                const blob = new Blob([csv], {type: 'text/csv'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'logimove_requests.csv';
                a.click();
                Swal.fire('Exported!', 'CSV file downloaded', 'success');
            };
            // User management list
            const userMgmt = document.getElementById('userManagementList');
            const allUsers = await getDocs(collection(db, "users"));
            userMgmt.innerHTML = '';
            for (const u of allUsers.docs) {
                const data = u.data();
                userMgmt.innerHTML += `<div class="border-b p-2 flex justify-between"><span>${data.email} (${data.role})</span><div><button class="suspendBtn text-red-500 text-xs" data-uid="${u.id}">Suspend</button> <button class="resetBtn text-blue-500 text-xs" data-email="${data.email}">Reset password</button></div></div>`;
            }
            document.querySelectorAll('.suspendBtn').forEach(btn => btn.addEventListener('click', () => Swal.fire('Demo', `Suspension of ${btn.dataset.uid} would be implemented with Firebase Admin SDK`, 'info')));
            document.querySelectorAll('.resetBtn').forEach(btn => btn.addEventListener('click', () => Swal.fire('Demo', `Password reset email to ${btn.dataset.email} would be sent`, 'info')));
            document.getElementById('adminLogout').onclick = async () => { await signOut(auth); currentUser = null; renderLogin(); };
            document.getElementById('darkModeToggleA').onclick = () => toggleDarkMode();
        }

        // ---------- MAIN ----------
        function startApp() {
            listenRequests();
            if (currentUser.email === 'admin@logimove.com') {
                currentRole = 'admin';
                renderAdminPanel();
            } else if (currentRole === 'customer') renderCustomerDashboard();
            else renderDriverDashboard();
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadUserData(user.uid);
                await initNotifications();
                startApp();
            } else {
                renderLogin();
            }
        });
    </script>
</body>
</html>
