<!DOCTYPE html>
<html>
<head>
    <title>LogiMove Test</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 300px; width: 100%; }
        body { font-family: sans-serif; padding: 20px; }
        pre { background: #f0f0f0; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>LogiMove - Debug Mode</h1>
    <div id="map"></div>
    <div id="status">Checking Firebase...</div>
    <pre id="log"></pre>

    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5hxpRq8WJ5f6EmNZPw-3II6910CXk4Z4",
            authDomain: "logimove-zambia.firebaseapp.com",
            projectId: "logimove-zambia",
            storageBucket: "logimove-zambia.firebasestorage.app",
            messagingSenderId: "136025058262",
            appId: "1:136025058262:web:821a7533b7b3e1b1b91277"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');
        
        function log(msg) {
            logDiv.innerHTML += msg + "\n";
            console.log(msg);
        }
        
        log("Firebase initialized");
        
        // Test map
        const map = L.map('map').setView([-15.3875, 28.3228], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
        log("Map loaded");
        
        // Test Firebase Auth
        onAuthStateChanged(auth, (user) => {
            if (user) {
                statusDiv.innerHTML = "✅ Logged in as: " + user.email;
                log("Auth: user logged in");
            } else {
                statusDiv.innerHTML = "🔓 Not logged in (Firebase Auth ready)";
                log("Auth: no user");
            }
        });
        
        // Test Firestore read
        try {
            const testQuery = await getDocs(collection(db, "users"));
            log("Firestore read successful. Found " + testQuery.size + " users.");
        } catch (err) {
            log("Firestore error: " + err.message);
        }
    </script>
</body>
</html>
