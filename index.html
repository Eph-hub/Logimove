    <style>
        body {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #4338ca;
            --primary-bg: #1e1b4b;
            --primary-hover: #4338ca;
            --primary-ring: rgba(79,70,229,0.3);
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            transition: background 0.3s, color 0.3s;
        }
        body.light {
            --bg: #f1f5f9;
            --card: white;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --primary-bg: #eef2ff;
        }
        .card { background: var(--card); border-color: var(--border); }
        .btn-primary { background: var(--primary); color: white; padding: 0.6rem 1.5rem; border-radius: 2rem; font-weight: 600; transition: background 0.2s; cursor: pointer; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .bg-primary-light { background: var(--primary-bg); }
        .text-primary { color: var(--primary); }
        .map-container { height: 280px; width: 100%; border-radius: 1.5rem; overflow: hidden; }
        input, select { background: var(--bg); border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.6rem 1rem; width: 100%; font-size: 0.9rem; transition: border 0.2s; color: var(--text); }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-ring); }
        .header-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 1.1rem; }
        .rating-badge { background: rgba(251,191,36,0.15); color: #fbbf24; padding: 0.1rem 0.6rem; border-radius: 2rem; font-size: 0.7rem; font-weight: 600; }

        /* ===== SMALLER SEARCH BOXES ===== */
        .loc-card {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 0.75rem;
            padding: 0.2rem 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: border 0.2s;
        }
        .loc-card.active-pickup { border-color: #10b981; }
        .loc-card.active-dropoff { border-color: #3b82f6; }
        .loc-card .icon {
            font-size: 1rem;
            flex-shrink: 0;
        }
        .loc-card input {
            border: none;
            background: transparent;
            padding: 0.15rem 0.2rem;
            flex: 1;
            color: var(--text);
            outline: none;
            font-size: 0.75rem;
        }
        .loc-card input::placeholder {
            color: var(--text-secondary);
            font-size: 0.7rem;
        }
        .loc-card .clear-btn {
            cursor: pointer;
            color: #ef4444;
            font-size: 0.7rem;
            flex-shrink: 0;
            padding: 0 0.2rem;
        }

        .autocomplete-dropdown { position: absolute; background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; max-height: 220px; overflow-y: auto; z-index: 30; width: 100%; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .autocomplete-item { padding: 0.5rem 1rem; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .autocomplete-item:hover { background: var(--primary-bg); }
        .saved-place-item { background: var(--primary-bg); color: var(--text); padding: 0.2rem 1rem; border-radius: 2rem; font-size: 0.8rem; cursor: pointer; display: inline-block; margin: 2px; }
        .saved-place-item:hover { background: var(--primary-light); }
        .chat-badge { background: #ef4444; color: white; border-radius: 50%; padding: 0 0.4rem; font-size: 0.7rem; font-weight: bold; margin-left: 4px; }
        .restaurant-card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 0.75rem; transition: 0.2s; cursor: pointer; }
        .restaurant-card:hover { transform: scale(1.02); border-color: var(--primary); }
        .menu-item { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid var(--border); }
        .cart-item { display: flex; justify-content: space-between; padding: 0.4rem 0; }
        .new-order-badge { background: #ef4444; color: white; border-radius: 50%; padding: 0.1rem 0.5rem; font-size: 0.7rem; font-weight: bold; margin-left: 4px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        .dropdown-menu {
            transition: opacity 0.2s ease, transform 0.2s ease;
            opacity: 0;
            transform: translateY(-5px);
            pointer-events: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            min-width: 200px;
            padding: 0.5rem 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 50;
            display: block;
        }
        .dropdown-menu.open {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .dropdown-item {
            display: block;
            padding: 0.5rem 1.5rem;
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        .dropdown-item:hover {
            background: var(--primary-bg);
        }
        .dropdown-item i {
            margin-right: 0.5rem;
            width: 1.2rem;
        }
        .dropdown-item.active-tab {
            background: var(--primary-bg);
            color: var(--primary);
            border-left: 3px solid var(--primary);
        }

        .theme-dot { width: 28px; height: 28px; border-radius: 50%; display: inline-block; cursor: pointer; border: 2px solid transparent; transition: border 0.2s; margin: 4px; }
        .theme-dot:hover { border-color: var(--text); }
        .theme-dot.active { border-color: var(--text); }

        /* Tracking link button */
        .tracking-link { background: var(--primary-bg); color: var(--primary); padding: 0.1rem 0.6rem; border-radius: 2rem; font-size: 0.65rem; cursor: pointer; border: 1px solid var(--primary); }
        .tracking-link:hover { background: var(--primary); color: white; }

        @media (max-width: 640px) { .map-container { height: 200px; } .header-avatar { width: 32px; height: 32px; font-size: 0.9rem; } }
    </style>
</head>
<body>
<div id="appContainer" class="max-w-7xl mx-auto p-3 md:p-6"></div>

<script type="module">
    // ---------- FIREBASE IMPORTS ----------

    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB5hxpRq8WJ5f6EmNZPw-3II6910CXk4Z4",
        authDomain: "logimove-zambia.firebaseapp.com",
        projectId: "logimove-zambia",
        storageBucket: "logimove-zambia.firebasestorage.app",
        messagingSenderId: "136025058262",
        appId: "1:136025058262:web:821a7533b7b3e1b1b91277"
    };
    const VAPID_KEY = "BA9DpLjj3iXB42GTsGrmu_Cv41BubNylrMcLYmnBBXTi4ib5pSUl46-tkskKk35URzS6-1NlYDA13fNGNTcBJVI";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const messaging = getMessaging(app);

    // ---------- GLOBALS ----------
    let currentUser = null, currentRole = null;
    let tempPickup = null, tempDropoff = null;
    let tempPickupAddress = null, tempDropoffAddress = null;
    let serviceType = "taxi";
    let customerMap, driverMap;

    let allRequests = [];
    let allRestaurants = [];

    let unsubscribeFoodOrders = null;
    let driverData = { currentLat: -15.3875, currentLng: 28.3228, status: "online", activeRequestId: null, carModel: '', plate: '', phone: '' };
    let mapSelectMode = "pickup";

    // Promo codes
    let activePromo = null;

    const RATES = { taxi: { base: 20, perKm: 5 }, delivery: { base: 30, perKm: 10 }, cargo: { base: 50, perKm: 15 } };
    const CURRENCY = "K";
    const PAYMENT_METHODS = ["Cash on Delivery", "Airtel Money", "MTN Money", "Zamtel Pay", "Card"];
    const VEHICLES = ['Car', 'Bike', 'Truck'];

    // ---------- HELPERS ----------
    function formatDate(t) { if (!t) return 'Unknown'; const d = t.toDate ? t.toDate() : new Date(t); return d.toLocaleDateString('en-ZM',{day:'2-digit',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-ZM',{hour:'2-digit',minute:'2-digit'}); }
    function formatTime(t) { if (!t) return ''; const d = t.toDate ? t.toDate() : new Date(t); return d.toLocaleTimeString('en-ZM',{day:'2-digit',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-ZM',{hour:'2-digit',minute:'2-digit'}); }
    function haversine(lat1,lng1,lat2,lng2) { const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLng=(lng2-lng1)*Math.PI/180; const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
    function estimateTime(dist) { const min=Math.round((dist/30)*60); if(min<1) return '1 min'; if(min<60) return min+' min'; const h=Math.floor(min/60); const m=min%60; return h+'h '+m+'min'; }
    function calculatePrice(dist, vehicleType = 'Car', weight = 0, dims = '') {
        let base = RATES[serviceType]?.base || 30;
        let perKm = RATES[serviceType]?.perKm || 10;
        // Vehicle adjustment
        if (vehicleType === 'Bike') { base *= 0.7; perKm *= 0.8; }
        else if (vehicleType === 'Truck') { base *= 1.5; perKm *= 1.3; }
        let price = base + dist * perKm;
        // Cargo weight adjustment
        if (serviceType === 'delivery' || serviceType === 'cargo') {
            const w = parseFloat(weight) || 0;
            if (w > 50) price += 20;
            else if (w > 20) price += 10;
            // Dimensions: extra for bulky items
            if (dims) {
                const parts = dims.split('x').map(Number);
                if (parts.length === 3) {
                    const vol = parts[0] * parts[1] * parts[2];
                    if (vol > 100000) price += 30;
                    else if (vol > 50000) price += 15;
                }
            }
        }
        return Math.round(price * 2) / 2;
    }

    // ---------- AUTO PRICE ----------
    function updatePriceDisplay(vehicleType = 'Car', weight = 0, dims = '') {
        if (!tempPickup || !tempDropoff) return;
        const dist = haversine(tempPickup.lat, tempPickup.lng, tempDropoff.lat, tempDropoff.lng);
        const price = calculatePrice(dist, vehicleType, weight, dims);
        const pInput = document.getElementById('priceInput');
        if (pInput) pInput.value = price;
        const dSpan = document.getElementById('distanceDisplay');
        if (dSpan) dSpan.innerText = dist.toFixed(2) + ' km';
        const eSpan = document.getElementById('etaDisplay');
        if (eSpan) eSpan.innerText = estimateTime(dist);
        const aSpan = document.getElementById('autoPriceDisplay');
        if (aSpan) aSpan.innerText = `${CURRENCY}${price}`;
        const bSpan = document.getElementById('fareBreakdown');
        if (bSpan) {
            const vehicleLabel = vehicleType || 'Car';
            bSpan.innerText = `${vehicleLabel} • ${dist.toFixed(2)}km • ${CURRENCY}${price}`;
        }
        return { dist, price };
    }

    function playNotificationSound() { try { const audioCtx=new(window.AudioContext||window.webkitAudioContext)(); const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.value=800; osc.type='sine'; gain.gain.setValueAtTime(0.3,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4); osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime+0.4); } catch(e){} }
    function showNotification(title,body) { if(Notification.permission==='granted') new Notification(title,{body}); else Swal.fire({title,text:body,icon:'info',toast:true,position:'top-end',timer:4000}); }
    async function initNotifications(){ if(fcmToken) return; try{ const p=await Notification.requestPermission(); if(p!=='granted') return; const token=await getToken(messaging,{vapidKey:VAPID_KEY}); if(token&&currentUser) await setDoc(doc(db,"fcmTokens",currentUser.uid),{token,role:currentRole},{merge:true}); fcmToken=token; }catch(e){console.warn("FCM error",e);} }
    onMessage(messaging,(p)=>showNotification(p.notification.title,p.notification.body));
    function haptic(){ if(navigator.vibrate) navigator.vibrate(10); }

    // ---------- RATINGS (two-way) ----------
    async function rateDriver(reqId, driverId, rating, comment) {
        await setDoc(doc(db,"ratings",reqId),{driverId,rating,comment,timestamp:serverTimestamp(),requestId:reqId,type:'driver'});
        const snap=await getDocs(query(collection(db,"ratings"),where("driverId","==",driverId),where("type","==","driver")));
        let total=0,count=0; snap.forEach(d=>{total+=d.data().rating; count++;});
        await updateDoc(doc(db,"drivers",driverId),{averageRating:total/count,ratingsCount:count});
        Swal.fire({title:'Thanks!',icon:'success',timer:1500,showConfirmButton:false});
    }

    async function rateCustomer(reqId, customerId, rating, comment) {
        await setDoc(doc(db,"ratings",reqId+'_customer'),{customerId,rating,comment,timestamp:serverTimestamp(),requestId:reqId,type:'customer'});
        const snap=await getDocs(query(collection(db,"ratings"),where("customerId","==",customerId),where("type","==","customer")));
        let total=0,count=0; snap.forEach(d=>{total+=d.data().rating; count++;});
        await updateDoc(doc(db,"users",customerId),{customerRating:total/count,ratingsCount:count});
        Swal.fire({title:'Customer rated!',icon:'success',timer:1500,showConfirmButton:false});
    }

    // ---------- AUTH ----------
    async function saveUserToFirestore(user, role, name, extra={}) {
        await setDoc(doc(db,"users", user.uid),{email:user.email, name, role,createdAt:serverTimestamp(), customerRating:0, ratingsCount:0});
        if(role==='driver') {
            await setDoc(doc(db,"drivers",user.uid),{
                currentLat:-15.3875,currentLng:28.3228,
                status: "online",activeRequestId: null,
                averageRating:0,ratingsCount:0,
                phone: extra.phone||'',
                carModel:extra.carModel||'',
                plate:extra.plate||''
            });
        }
    }

    async function loadUserData(uid) {
        const userSnap=await getDoc(doc(db,"users",uid));
        if(userSnap.exists()) currentRole=userSnap.data().role;
        if(currentRole==='driver') {
            const drvSnap=await getDoc(doc(db,"drivers",uid));
            if(drvSnap.exists()) driverData=drvSnap.data();
            else await setDoc(doc(db,"drivers",uid),driverData);
        }
        const savedSnap=await getDoc(doc(db,"savedPlaces",uid));
        if(savedSnap.exists()) {
            const data = savedSnap.data();
            savedPlaces = data.places || [];
            defaultHome = data.defaultHome || null;
            defaultWork = data.defaultWork || null;
        }
    }

    // ---------- LISTENERS ----------
    function listenRequests() {
        if(unsubscribeRequests) unsubscribeRequests();
        const q=query(collection(db,"requests"),orderBy("createdAt","desc"));
        unsubscribeRequests=onSnapshot(q,(snap)=>{
            const newDocs = snap.docChanges().filter(change => change.type === 'added');
            if (currentRole === 'driver' && driverData.status === 'online') {
                newDocs.forEach(change => {
                    const req = { id: change.doc.id, ...change.doc.data() };
                    if (req.status === 'pending' && !seenRequestIds.has(req.id)) {
                        seenRequestIds.add(req.id);
                        newOrderCount++;
                        playNotificationSound();
                        const type = req.type === 'taxi' ? '🚖 Taxi' : '📦 Delivery';
                        showNotification(`New ${type} request!`, `From ${req.customerName} • ${CURRENCY}${req.price}`);
                        updateNewOrderBadge();
                    }
                });
            }
            allRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (currentRole === 'customer') renderCustomerTabs();
            else if (currentRole === 'driver') renderDriverTabs();
            else if (currentRole === 'admin') renderAdminPanel();
        });
    }

    function listenFoodOrders() {
        if(unsubscribeFoodOrders) unsubscribeFoodOrders();
        const q=query(collection(db,"foodOrders"),orderBy("createdAt","desc"));
        unsubscribeFoodOrders=onSnapshot(q,(snap)=>{
            const newDocs = snap.docChanges().filter(change => change.type === 'added');
            if (currentRole === 'driver' && driverData.status === 'online') {
                newDocs.forEach(change => {
                    const order = { id: change.doc.id, ...change.doc.data() };
                    if (order.status === 'pending' && !seenRequestIds.has(order.id)) {
                        seenRequestIds.add(order.id);
                        newOrderCount++;
                        playNotificationSound();
                        showNotification(`🍔 New food order!`, `From ${order.customerName} • ${CURRENCY}${order.total}`);
                        updateNewOrderBadge();
                    }
                });
            }
        });
    }

    function updateNewOrderBadge() {
        const badge = document.getElementById('newOrderBadge');
        if (badge) {
            if (newOrderCount > 0) { badge.innerText = newOrderCount; badge.classList.remove('hidden'); }
            else { badge.classList.add('hidden'); }
        }
    }
    function resetNewOrderBadge() { newOrderCount = 0; seenRequestIds.clear(); updateNewOrderBadge(); }

    // ---------- THEME ----------
    const themes=[
        {name:'Indigo',primary:'#4f46e5',light:'#818cf8',dark:'#4338ca',bg:'#1e1b4b'},
        {name:'Blue',primary:'#3b82f6',light:'#60a5fa',dark:'#2563eb',bg:'#1e293b'},
        {name:'Green',primary:'#10b981',light:'#34d399',dark:'#059669',bg:'#064e3b'},
        {name:'Orange',primary:'#f97316',light:'#fb923c',dark:'#ea580c',bg:'#431407'},
        {name:'Purple',primary:'#8b5cf6',light:'#a78bfa',dark:'#7c3aed',bg:'#2e1065'},
        {name:'Red',primary:'#ef4444',light:'#f87171',dark:'#dc2626',bg:'#450a0a'},
        {name:'Teal',primary:'#14b8a6',light:'#2dd4bf',dark:'#0d9488',bg:'#042f2e'}
    ];
    let currentTheme=localStorage.getItem('theme')||'Indigo';
    function applyTheme(name){
        const t=themes.find(x=>x.name===name); if(!t) return;
        document.documentElement.style.setProperty('--primary',t.primary);
        document.documentElement.style.setProperty('--primary-light',t.light);
        document.documentElement.style.setProperty('--primary-dark',t.dark);
        document.documentElement.style.setProperty('--primary-bg',t.bg);
        document.documentElement.style.setProperty('--primary-hover',t.dark);
        document.documentElement.style.setProperty('--primary-ring',t.primary+'40');
        localStorage.setItem('theme',name);
        currentTheme=name;
        document.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.theme===name));
    }
    applyTheme(currentTheme);

    // ---------- LOGIN ----------
    function renderLogin() {
        document.getElementById('appContainer').innerHTML=`
            <div class="min-h-screen flex items-center justify-center p-4">
                <div class="card max-w-md w-full text-center p-6 rounded-2xl shadow" style="background:var(--card);">
                    <div class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4" style="background:var(--primary-bg);">
                        <i class="fas fa-truck-fast text-4xl" style="color:var(--primary);"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 dark:text-white">Logi<span style="color:var(--primary);">Moves</span> <span style="color:var(--primary);">Zm</span></h1>
                    <p class="text-gray-500 dark:text-gray-300 text-sm mb-6">• Ride • Delivery • Food</p>
                    <input type="email" id="loginEmail" placeholder="Email" class="mb-3">
                    <input type="password" id="loginPassword" placeholder="Password" class="mb-3">
                    <button id="loginBtn" class="btn-primary w-full">Login</button>
                    <div class="mt-4 text-sm text-gray-500 dark:text-gray-400">
                        <span class="cursor-pointer underline" id="showCustomerReg">New Customer</span> •
                        <span class="cursor-pointer underline" id="showDriverReg">New Driver</span>
                    </div>
                    <div id="customerRegForm" class="hidden mt-4 space-y-3">
                        <input type="text" id="custName" placeholder="Full name">
                        <input type="email" id="custEmail" placeholder="Email">
                        <input type="password" id="custPwd" placeholder="Password">
                        <button id="doCustomerReg" class="btn-primary w-full">Register as Customer</button>
                    </div>
                    <div id="driverRegForm" class="hidden mt-4 space-y-3">
                        <input type="text" id="drvFullName" placeholder="Full name">
                        <input type="email" id="drvEmail" placeholder="Email">
                        <input type="password" id="drvPwd" placeholder="Password">
                        <input type="tel" id="drvPhone" placeholder="Phone (e.g. 0977...)">
                        <input type="text" id="drvCarModel" placeholder="Car model">

    // ============================================================
    // =============== HEADER (role‑aware dropdown) ===============
    // ============================================================
    function renderHeader(title, logoutId) {
        let tabs = [];
        if (currentRole === 'customer') {
            tabs = [
                { id: 'rides', icon: 'fa-taxi', label: 'Rides' },
                { id: 'food', icon: 'fa-utensils', label: 'Food' },
                { id: 'shops', icon: 'fa-store', label: 'Shops' },
                { id: 'cargo', icon: 'fa-box', label: 'Cargo' },
                { id: 'history', icon: 'fa-history', label: 'History' }
            ];
        } else if (currentRole === 'driver') {
            tabs = [
                { id: 'map', icon: 'fa-map-marker-alt', label: 'Home' },
                { id: 'requests', icon: 'fa-clipboard-list', label: 'Available' },
                { id: 'active', icon: 'fa-truck', label: 'Active' },
                { id: 'history', icon: 'fa-history', label: 'History' },
            ];
        } else {
            tabs = [
                { id: 'admin', icon: 'fa-chart-line', label: 'Dashboard' },
            ];
        }

        const tabsHtml = tabs.map(t => `
            <a data-tab="${t.id}" class="dropdown-item ${activeTab === t.id ? 'active-tab' : ''}">
                <i class="fas ${t.icon}"></i> ${t.label}
            </a>

        return `
            <div class="flex justify-between items-center mb-3 flex-wrap gap-2">

                    <div class="header-avatar">${currentUser?.email?.charAt(0).toUpperCase() || 'U'}</div>

                        <div class="font-bold text-lg">${currentUser?.displayName || currentUser?.email?.split('@')[0] || 'User'}</div>

                            ${currentRole === 'customer' ? `<span class="rating-badge"><i class="fas fa-star text-green-400"></i> ${(currentUser?.customerRating || 0).toFixed(1)}</span>` : ''}
                            <button id="driverModeToggle" class="text-xs bg-gray-200 dark:bg-gray-700 px-3 py-0.5 rounded-full">${currentRole === 'driver' ? '🔴 Driver mode' : '👤 Passenger mode'}</button>

                </div>
                ${currentRole === 'customer' ? `
                    <hr class="my-2 border-gray-300">
                    <div class="text-center">
                        <button id="editProfileBtn" class="btn-primary text-sm px-4 py-1">✏️ Edit Profile</button>
                    </div>
                    <div class="mt-2">
                        <p class="font-semibold text-sm">🏠 Default Places</p>
                        <div class="flex gap-2 mt-1">
                            <button id="setHomeBtn" class="text-xs bg-blue-100 dark:bg-blue-900 px-3 py-1 rounded-full">Set Home</button>

                    </div>
                ` : ''}

                    ${currentRole === 'customer' ? '🚗 Trips: ' + allRequests.filter(r => r.customerId === currentUser?.uid).length : ''}
                    ${currentRole === 'driver' ? '🚚 Completed: ' + allRequests.filter(r => r.driverId === currentUser?.uid && r.status === 'delivered').length : ''}
                </div>
            </div>
        `;

        Swal.fire({
            title: '👤 Profile',
            html: html,
            confirmButtonText: 'Close',
            didOpen: (modal) => {
                const container = modal.querySelector('.swal2-html-container') || modal;

                container.querySelectorAll('.theme-dot').forEach(dot => {
                    dot.addEventListener('click', () => {
                        const themeName = dot.dataset.theme;
                        applyTheme(themeName);
                        container.querySelectorAll('.theme-dot').forEach(d => {
                            d.classList.toggle('active', d.dataset.theme === themeName);
                            d.style.borderColor = d.dataset.theme === themeName ? 'var(--text)' : 'transparent';
                        });
                    });
                });

                const darkToggle = container.querySelector('#profileDarkToggle');
                if (darkToggle) {
                    darkToggle.addEventListener('click', () => {
                        document.body.classList.toggle('light');
                        localStorage.setItem('lightMode', document.body.classList.contains('light'));
                        darkToggle.innerText = document.body.classList.contains('light') ? '🌙 Dark Mode' : '☀️ Light Mode';

                if (editBtn) {

                            input: 'text',
                            inputLabel: 'Full name',
                            inputValue: currentUser?.displayName || '',
                            showCancelButton: true
                        });
                        if (newName && newName.trim()) {
                            try {
                                await updateDoc(doc(db, "users", currentUser.uid), { name: newName.trim() });

                                renderCustomerTabs();
                            } catch (e) {
                                Swal.fire('Error', e.message, 'error');
                            }
                        }
                    });
                }

                // Default places
                const setHomeBtn = container.querySelector('#setHomeBtn');
                const setWorkBtn = container.querySelector('#setWorkBtn');
                const clearDefaultsBtn = container.querySelector('#clearDefaultsBtn');

                if (setHomeBtn) {
                    setHomeBtn.addEventListener('click', async () => {
                        if (!tempPickup) return Swal.fire('No location', 'Set a pickup location first on the map.', 'info');
                        defaultHome = { name: tempPickupAddress || 'Home', lat: tempPickup.lat, lng: tempPickup.lng };
                        await setDoc(doc(db, "savedPlaces", currentUser.uid), { places: savedPlaces, defaultHome, defaultWork }, { merge: true });
                        Swal.fire({ title: 'Home set!', icon: 'success', timer: 1000 });
                    });
                }
                if (setWorkBtn) {
                    setWorkBtn.addEventListener('click', async () => {
                        if (!tempPickup) return Swal.fire('No location', 'Set a pickup location first on the map.', 'info');
                        defaultWork = { name: tempPickupAddress || 'Work', lat: tempPickup.lat, lng: tempPickup.lng };
                        await setDoc(doc(db, "savedPlaces", currentUser.uid), { places: savedPlaces, defaultHome, defaultWork }, { merge: true });
                        Swal.fire({ title: 'Work set!', icon: 'success', timer: 1000 });
                    });
                }
                if (clearDefaultsBtn) {
                    clearDefaultsBtn.addEventListener('click', async () => {
                        defaultHome = null; defaultWork = null;
                        await setDoc(doc(db, "savedPlaces", currentUser.uid), { places: savedPlaces, defaultHome, defaultWork }, { merge: true });
                        Swal.fire({ title: 'Defaults cleared', icon: 'info', timer: 1000 });
                    });
                }
            }
        });
    }

    // ============================================================
    // =============== CUSTOMER DASHBOARD =========================
    // ============================================================
    function renderCustomerTabs() {
        document.getElementById('appContainer').innerHTML = `
            <div class="fade-in">
                ${renderHeader(``, 'logoutBtn')}
                <div id="tabContent">Loading...</div>
            </div>`;
        document.getElementById('driverModeToggle').onclick = async () => {
            if (currentRole === 'driver') {
                await updateDoc(doc(db, "users", currentUser.uid), { role: 'customer' });
                currentRole = 'customer';
                Swal.fire({ title: 'Switched to Passenger mode', icon: 'info', timer: 1500, showConfirmButton: false });
                renderCustomerTabs();
            } else {
                await updateDoc(doc(db, "users", currentUser.uid), { role: 'driver' });
                currentRole = 'driver';
                const drvSnap = await getDoc(doc(db, "drivers", currentUser.uid));
                if (!drvSnap.exists()) await setDoc(doc(db, "drivers", currentUser.uid), driverData);
                Swal.fire({ title: 'Switched to Driver mode', icon: 'info', timer: 1500, showConfirmButton: false });
                renderDriverTabs();
            }
        };

        const dropdownMenu = document.getElementById('dropdownMenu');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        hamburgerBtn?.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu?.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (dropdownMenu && hamburgerBtn && 
                !dropdownMenu.contains(e.target) && 
                !hamburgerBtn.contains(e.target)) {
                dropdownMenu.classList.remove('open');
            }
        });
        dropdownMenu?.querySelectorAll('[data-tab]').forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = item.dataset.tab;
                if (tab === 'profile') {
                    showProfileModal();
                    dropdownMenu.classList.remove('open');
                    return;
                }
                dropdownMenu.classList.remove('open');
                activeTab = tab;
                renderCustomerTabs();
            });
        });

        document.getElementById('logoutBtn').onclick=async()=>{await signOut(auth); currentUser=null; renderLogin();};
        document.getElementById('refreshBtn').onclick=()=>{listenRequests(); Swal.fire({title:'Refreshed!',icon:'success',timer:800,showConfirmButton:false});};
        document.getElementById('modeToggle').onclick=()=>{document.body.classList.toggle('light'); localStorage.setItem('lightMode',document.body.classList.contains('light')); renderCustomerTabs();};
        const content=document.getElementById('tabContent');
        if (activeTab === 'rides') renderRidesTab(content);
        else {
            switch(activeTab) {
                case 'food': renderCustomerFoodTab(content); break;
                case 'shops': renderCustomerShopsTab(content); break;
                case 'cargo': renderCustomerCargoTab(content); break;
                case 'history': renderCustomerHistoryTab(content); break;
                default: renderRidesTab(content);
            }
        }
        updateNewOrderBadge();
    }

            const dims = document.getElementById('cargoDims')?.value || '';
            updatePriceDisplay(vehicle, weight, dims);
        });
        document.getElementById('cargoDims')?.addEventListener('input', () => {
            const vehicle = document.getElementById('vehicleSelect')?.value || 'Car';
            const weight = document.getElementById('cargoWeight')?.value || 0;
            const dims = document.getElementById('cargoDims')?.value || '';
            updatePriceDisplay(vehicle, weight, dims);
        });
        document.getElementById('vehicleSelect')?.addEventListener('change', (e) => {
            const vehicle = e.target.value;

            updatePriceDisplay(vehicle, weight, dims);
        });
    }

    // ============================================================
    // =============== MAP EVENTS (shared) ========================
    // ============================================================
    function attachMapEvents(container) {
        const pickupInput = document.getElementById('pickupInput');
        const dropoffInput = document.getElementById('dropoffInput');
        const pickupDropdown = document.getElementById('pickupDropdown');
        const dropoffDropdown = document.getElementById('dropoffDropdown');
        const searchBtn = document.getElementById('searchBtn');
        const publishBtn = document.getElementById('publishBtn');

        // Apply promo
        const applyPromoBtn = document.getElementById('applyPromoBtn');
        if (applyPromoBtn) {
            applyPromoBtn.addEventListener('click', () => {
                const code = document.getElementById('promoInput')?.value?.toUpperCase()?.trim();
                if (!code) return Swal.fire('Enter a code');
                if (PROMO_CODES[code] !== undefined) {
                    activePromo = { code, discount: PROMO_CODES[code] };
                    Swal.fire({ title: `Promo applied! ${code} – ${PROMO_CODES[code]*100}% off`, icon: 'success', timer: 1500 });
                    updatePriceDisplay();
                } else {
                    Swal.fire('Invalid code', 'Try SAVE10, SAVE20, or FREE', 'warning');
                }
            });
        }

        function performSearch() {
            if (!tempPickup || !tempDropoff) {
                Swal.fire('Missing locations', 'Please set both pickup and dropoff.', 'warning');
                return;
            }
            const vehicle = document.getElementById('vehicleSelect')?.value || 'Car';
            const weight = document.getElementById('cargoWeight')?.value || 0;
            const dims = document.getElementById('cargoDims')?.value || '';
            const result = updatePriceDisplay(vehicle, weight, dims);
            if (result) {
                searchPerformed = true;
                publishBtn.disabled = false;
                let promoText = '';
                if (activePromo) {
                    const discounted = result.price * (1 - activePromo.discount);
                    promoText = `<br>💰 After promo: <strong>${CURRENCY}${discounted.toFixed(2)}</strong> (${activePromo.discount*100}% off)`;
                }
                Swal.fire({
                    title: 'Trip Approved!',
                    html: `Distance: <strong>${result.dist.toFixed(2)} km</strong><br>ETA: <strong>${estimateTime(result.dist)}</strong><br>Price: <strong>${CURRENCY}${result.price}</strong>${promoText}`,
                    icon: 'success',
                    timer: 3000,
                    showConfirmButton: true
                });
            }
        }

        async function performSearchInput(input, dropdown, mode) {
            const query = input.value.trim();
            if (query.length < 2) { dropdown.style.display = 'none'; return; }
            const results = await searchAddress(query);
            if (!results.length) { dropdown.style.display = 'none'; return; }
            dropdown.innerHTML = results.map(r => {
                let time = '—';
                const loc = mode === 'pickup' ? tempDropoff : tempPickup;
                if (loc) { const dist = haversine(loc.lat, loc.lng, r.lat, r.lng); time = estimateTime(dist); }
                return `<div class="autocomplete-item" data-lat="${r.lat}" data-lng="${r.lng}" data-name="${r.display_name}"><span>${r.display_name}</span><span class="time">${time}</span></div>`;
            }).join('');
            dropdown.style.display = 'block';
            dropdown.querySelectorAll('.autocomplete-item').forEach(el => {
                el.addEventListener('click', () => {
                    const lat = parseFloat(el.dataset.lat), lng = parseFloat(el.dataset.lng), name = el.dataset.name;
                    setLocationForMode(mode, { lat, lng }, name);
                    input.value = name;
                    dropdown.style.display = 'none';
                    searchPerformed = false;
                    publishBtn.disabled = true;
                });
            });
        }

        function debounce(fn, delay) {
            let timer;
            return function(...args) { clearTimeout(timer); timer = setTimeout(() => fn.apply(this, args), delay); };
        }

        pickupInput.addEventListener('input', debounce(() => { setActiveMode('pickup'); performSearchInput(pickupInput, pickupDropdown, 'pickup'); }, 300));
        dropoffInput.addEventListener('input', debounce(() => { setActiveMode('dropoff'); performSearchInput(dropoffInput, dropoffDropdown, 'dropoff'); }, 300));

        document.getElementById('clearPickupInput').addEventListener('click', () => {
            pickupInput.value = '';
            tempPickup = null; tempPickupAddress = null;
            updateLocationUI(); 
            searchPerformed = false;
            publishBtn.disabled = true;
            if (pickupMarker && window.customerMap) { window.customerMap.removeLayer(pickupMarker); pickupMarker = null; }
            drawCustomerRoute();
            pickupDropdown.style.display = 'none';
        });
        document.getElementById('clearDropoffInput').addEventListener('click', () => {
            dropoffInput.value = '';
            tempDropoff = null; tempDropoffAddress = null;
            updateLocationUI();
            searchPerformed = false;
            publishBtn.disabled = true;
            if (dropoffMarker && window.customerMap) { window.customerMap.removeLayer(dropoffMarker); dropoffMarker = null; }
            drawCustomerRoute();
            dropoffDropdown.style.display = 'none';
        });

        document.getElementById('pickupCard').addEventListener('click', () => setActiveMode('pickup'));
        document.getElementById('dropoffCard').addEventListener('click', () => setActiveMode('dropoff'));

        document.getElementById('useMyLocation').addEventListener('click', () => {
            haptic();
            if (navigator.geolocation) {
                Swal.fire({ title: 'Getting location...', timer: 2000, didOpen: () => Swal.showLoading() });
                navigator.geolocation.getCurrentPosition(pos => {
                    const ll = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    setLocationForMode('pickup', ll, '📍 My location');
                    pickupInput.value = '📍 My location';
                    if (window.customerMap) window.customerMap.setView([pos.coords.latitude, pos.coords.longitude], 14);
                    Swal.close();
                    searchPerformed = false;
                    publishBtn.disabled = true;
                }, () => { Swal.fire('Error', 'Could not get location', 'error'); });
            } else Swal.fire('Error', 'Geolocation not supported', 'error');
        });

        // Default Home/Work buttons
        const homeBtn = document.getElementById('defaultHomeBtn');
        if (homeBtn) {
            homeBtn.addEventListener('click', () => {
                if (defaultHome) {
                    setLocationForMode('pickup', { lat: defaultHome.lat, lng: defaultHome.lng }, defaultHome.name);
                    pickupInput.value = defaultHome.name;
                } else Swal.fire('No home set', 'Set it in your profile first.', 'info');
            });
        }
        const workBtn = document.getElementById('defaultWorkBtn');
        if (workBtn) {
            workBtn.addEventListener('click', () => {
                if (defaultWork) {
                    setLocationForMode('pickup', { lat: defaultWork.lat, lng: defaultWork.lng }, defaultWork.name);
                    pickupInput.value = defaultWork.name;
                } else Swal.fire('No work address set', 'Set it in your profile first.', 'info');
            });
        }

        document.getElementById('swapLocations').addEventListener('click', () => {
            const tempP = tempPickup, tempA = tempPickupAddress;
            tempPickup = tempDropoff; tempPickupAddress = tempDropoffAddress;
            tempDropoff = tempP; tempDropoffAddress = tempA;
            pickupInput.value = tempPickupAddress || '';
            dropoffInput.value = tempDropoffAddress || '';
            updateLocationUI();
            searchPerformed = false;
            publishBtn.disabled = true;
            if (pickupMarker && window.customerMap) { window.customerMap.removeLayer(pickupMarker); pickupMarker=null; }
            if (dropoffMarker && window.customerMap) { window.customerMap.removeLayer(dropoffMarker); dropoffMarker=null; }
            if (tempPickup) pickupMarker = L.marker([tempPickup.lat,tempPickup.lng]).addTo(window.customerMap).bindTooltip('Pickup');
            if (tempDropoff) dropoffMarker = L.marker([tempDropoff.lat,tempDropoff.lng]).addTo(window.customerMap).bindTooltip('Dropoff');
            drawCustomerRoute();
            Swal.fire({ title: 'Swapped!', icon: 'info', timer: 800, showConfirmButton: false });
        });

        document.getElementById('saveLocationBtn').addEventListener('click', async () => {
            haptic();
            const mode = mapSelectMode;
            const loc = mode === 'pickup' ? tempPickup : tempDropoff;
            const addr = mode === 'pickup' ? tempPickupAddress : tempDropoffAddress;
            if (!loc) return Swal.fire('No location to save');
            const { value: name } = await Swal.fire({ title: 'Save this place', input: 'text', inputLabel: 'Name', inputPlaceholder: 'Home, Work...', showCancelButton: true });
            if (!name) return;
            savedPlaces.push({ name, lat: loc.lat, lng: loc.lng, address: addr || 'Point' });
            await setDoc(doc(db,"savedPlaces",currentUser.uid),{places:savedPlaces, defaultHome, defaultWork});
            renderSavedPlaces();
            Swal.fire({ title: 'Saved!', icon: 'success', timer: 1000 });
        });

        searchBtn.addEventListener('click', performSearch);

        publishBtn.addEventListener('click', async () => {
            if (!searchPerformed) {
                Swal.fire('Please search first', 'Click the Search button to approve the trip.', 'info');
                return;
            }
            if (!tempPickup || !tempDropoff) return Swal.fire('Error','Set both pickup and dropoff','warning');
            if (tempPickup.lat === tempDropoff.lat && tempPickup.lng === tempDropoff.lng) return Swal.fire('Same location');
            let price = parseFloat(document.getElementById('priceInput').value);
            const vehicle = document.getElementById('vehicleSelect')?.value || 'Car';
            const weight = document.getElementById('cargoWeight')?.value || 0;
            const dims = document.getElementById('cargoDims')?.value || '';
            if (isNaN(price)) price = calculatePrice(haversine(tempPickup.lat,tempPickup.lng,tempDropoff.lat,tempDropoff.lng), vehicle, weight, dims);
            if (activePromo) price = price * (1 - activePromo.discount);
            if (price <= 0) return Swal.fire('Invalid price');
            const detail = document.getElementById('cargoSelect').value;
            const payment = document.getElementById('paymentSelect').value;
            const scheduled = document.getElementById('scheduleTime')?.value || null;
            try {
                const counterRef = doc(db,"counters","requests");
                let tripNumber = 1;
                await runTransaction(db, async (transaction) => {
                    const counterDoc = await transaction.get(counterRef);
                    if (counterDoc.exists()) tripNumber = counterDoc.data().current + 1;
                    transaction.set(counterRef, { current: tripNumber });
                });
                const req = {
                    customerId: currentUser.uid,
                    customerName: currentUser.email,
                    type: serviceType,
                    cargoDetail: detail,
                    price: Math.round(price * 100) / 100,
                    paymentMethod: payment,
                    status: 'pending',
                    driverId: null,
                    driverName: null,
                    driverCar: '',
                    driverPlate: '',
                    vehicleType: vehicle,
                    weight: parseFloat(weight) || 0,
                    dimensions: dims || '',
                    pickupLatLng: { lat: tempPickup.lat, lng: tempPickup.lng },
                    dropoffLatLng: { lat: tempDropoff.lat, lng: tempDropoff.lng },
                    pickupAddress: tempPickupAddress || 'Pickup',
                    dropoffAddress: tempDropoffAddress || 'Dropoff',
                    createdAt: serverTimestamp(),
                    tripNumber: tripNumber,
                    scheduledFor: scheduled || null,
                    promoCode: activePromo?.code || null
                };
                await addDoc(collection(db,"requests"), req);
                Swal.fire({ title: 'Request sent!', icon: 'success', timer: 2000 });
                showNotification('New request', 'Drivers can see it');
                pickupInput.value = ''; dropoffInput.value = '';
                tempPickup = null; tempPickupAddress = null;
                tempDropoff = null; tempDropoffAddress = null;
                updateLocationUI();
                searchPerformed = false;
                publishBtn.disabled = true;
                if (pickupMarker && window.customerMap) { window.customerMap.removeLayer(pickupMarker); pickupMarker = null; }
                if (dropoffMarker && window.customerMap) { window.customerMap.removeLayer(dropoffMarker); dropoffMarker = null; }
                drawCustomerRoute();
                activePromo = null;
                document.getElementById('promoInput').value = '';
            } catch(e) {
                Swal.fire('Error', e.message, 'error');
            }
        });

        document.addEventListener('click', (e) => {
            if (!pickupInput.contains(e.target) && !pickupDropdown.contains(e.target)) pickupDropdown.style.display = 'none';
            if (!dropoffInput.contains(e.target) && !dropoffDropdown.contains(e.target)) dropoffDropdown.style.display = 'none';
        });

        renderSavedPlaces();
        initCustomerMap();
        pickupInput.value = tempPickupAddress || '';
        dropoffInput.value = tempDropoffAddress || '';
        updateLocationUI();
        if (tempPickup && tempDropoff) {
            const vehicle = document.getElementById('vehicleSelect')?.value || 'Car';
            const weight = document.getElementById('cargoWeight')?.value || 0;
            const dims = document.getElementById('cargoDims')?.value || '';
            updatePriceDisplay(vehicle, weight, dims);
        }
    }

    // ---------- LOCATION HELPERS ----------
    function setLocationForMode(mode, latlng, address) {
        haptic();
        if (mode === 'pickup') {
            tempPickup = latlng;
            tempPickupAddress = address || '📍 Point';
            document.getElementById('pickupInput').value = tempPickupAddress;
            document.getElementById('pickupCard').classList.add('active-pickup');
            document.getElementById('dropoffCard').classList.remove('active-dropoff');
        } else {
            tempDropoff = latlng;
            tempDropoffAddress = address || '🏁 Point';
            document.getElementById('dropoffInput').value = tempDropoffAddress;
            document.getElementById('dropoffCard').classList.add('active-dropoff');
            document.getElementById('pickupCard').classList.remove('active-pickup');
        }
        updateLocationUI();
        searchPerformed = false;
        const publishBtn = document.getElementById('publishBtn');
        if (publishBtn) publishBtn.disabled = true;
        if (window.customerMap) {
            if (pickupMarker && tempPickup) { pickupMarker.setLatLng([tempPickup.lat, tempPickup.lng]); }
            else if (tempPickup) { pickupMarker = L.marker([tempPickup.lat, tempPickup.lng]).addTo(window.customerMap).bindTooltip('Pickup'); }
            if (dropoffMarker && tempDropoff) { dropoffMarker.setLatLng([tempDropoff.lat, tempDropoff.lng]); }
            else if (tempDropoff) { dropoffMarker = L.marker([tempDropoff.lat, tempDropoff.lng]).addTo(window.customerMap).bindTooltip('Dropoff'); }
            drawCustomerRoute();
        }
    }

    function setActiveMode(mode) {
        mapSelectMode = mode;
        const pickupCard = document.getElementById('pickupCard');
        const dropoffCard = document.getElementById('dropoffCard');
        if (pickupCard) {
            pickupCard.classList.toggle('active-pickup', mode === 'pickup');
            pickupCard.classList.remove('active-dropoff');
        }
        if (dropoffCard) {
            dropoffCard.classList.toggle('active-dropoff', mode === 'dropoff');
            dropoffCard.classList.remove('active-pickup');
        }
    }

    function updateLocationUI() { renderSavedPlaces(); }

    // ---------- MAP INIT ----------
    function initCustomerMap() {
        if (customerMap) { customerMap.remove(); customerMap = null; }
        const center = tempPickup || { lat: -15.3875, lng: 28.3228 };
        customerMap = L.map('customerMap').setView([center.lat, center.lng], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(customerMap);
        customerMap.on('click', (e) => {
            const ll = e.latlng;
            const addr = `${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;
            setLocationForMode(mapSelectMode, ll, addr);
        });
        if (tempPickup) pickupMarker = L.marker([tempPickup.lat,tempPickup.lng]).addTo(customerMap).bindTooltip('Pickup');
        if (tempDropoff) dropoffMarker = L.marker([tempDropoff.lat,tempDropoff.lng]).addTo(customerMap).bindTooltip('Dropoff');
        window.customerMap = customerMap;
        drawCustomerRoute();
        if (tempPickup && tempDropoff) {
            L.Routing.control({
                waypoints: [L.latLng(tempPickup.lat,tempPickup.lng), L.latLng(tempDropoff.lat,tempDropoff.lng)],
                routeWhileDragging: false,
                showAlternatives: false,
                lineOptions: {styles: [{color: 'var(--primary)', weight: 4}]},
                createMarker: function() { return null; }
            }).addTo(customerMap);
        }
        const activeTrip = allRequests.find(r => r.customerId === currentUser?.uid && (r.status === 'accepted' || r.status === 'pickedUp'));
        if (activeTrip && activeTrip.driverId) {
            if (driverPosUnsub) driverPosUnsub();
            driverPosUnsub = onSnapshot(doc(db,"drivers",activeTrip.driverId), (docSnap) => {
                if (docSnap.exists() && window.customerMap) {
                    const loc = docSnap.data();
                    if (driverMarkerCust) driverMarkerCust.setLatLng([loc.currentLat,loc.currentLng]);
                    else driverMarkerCust = L.marker([loc.currentLat,loc.currentLng], { icon: L.divIcon({ html: '<i class="fas fa-truck-fast text-indigo-700 text-2xl"></i>', iconSize: [24,24] }) }).addTo(window.customerMap).bindTooltip('Driver');
                    if (activeTrip.dropoffLatLng) {
                        const dist = haversine(loc.currentLat,loc.currentLng,activeTrip.dropoffLatLng.lat,activeTrip.dropoffLatLng.lng);
                        const eta = estimateTime(dist);
                        if (driverMarkerCust) driverMarkerCust.bindTooltip(`Driver • ETA ${eta}`).openTooltip();
                        const etaSpan = document.getElementById('etaDisplay');
                        if (etaSpan) etaSpan.innerText = eta;
                    }
                }
            });
        }
    }

    function drawCustomerRoute() {
        if (customerRouteLine && window.customerMap) {
            window.customerMap.removeLayer(customerRouteLine);
            customerRouteLine = null;
        }
        if (tempPickup && tempDropoff && window.customerMap) {
            customerRouteLine = L.polyline([[tempPickup.lat,tempPickup.lng],[tempDropoff.lat,tempDropoff.lng]], { color: 'var(--primary)', weight: 3, dashArray: '5,10' }).addTo(window.customerMap);
        }
    }

    // ---------- SAVED PLACES ----------
    async function renderSavedPlaces() {
        const container = document.getElementById('savedPlacesList');
        if (!container) return;
        if (!savedPlaces.length) { container.innerHTML = ''; return; }
        container.innerHTML = savedPlaces.map(p => `<div class="saved-place-item" data-lat="${p.lat}" data-lng="${p.lng}" data-name="${p.name}" data-address="${p.address||p.name}"><i class="fas fa-map-pin" style="color:var(--primary);"></i> ${escapeHtml(p.name)} <i class="fas fa-trash-alt text-red-400 delete-place" data-name="${p.name}" style="cursor:pointer"></i></div>`).join('');
        document.querySelectorAll('.saved-place-item').forEach(el => {
            const lat=parseFloat(el.dataset.lat), lng=parseFloat(el.dataset.lng), name=el.dataset.name, address=el.dataset.address;
            el.addEventListener('click', (e) => {
                if (e.target.classList.contains('delete-place')) return;
                setLocationForMode(mapSelectMode, {lat,lng}, address||name);
            });
            const del = el.querySelector('.delete-place');
            if (del) del.addEventListener('click', async (e) => {
                e.stopPropagation();
                savedPlaces = savedPlaces.filter(p => p.name !== name);
                await setDoc(doc(db,"savedPlaces",currentUser.uid),{places:savedPlaces, defaultHome, defaultWork});
                renderSavedPlaces();
            });
        });
    }

    async function searchAddress(q) {
        if(q.length<2) return [];
        const url=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=6&countrycodes=zm&addressdetails=1`;
        try{const res=await fetch(url); const data=await res.json(); return data.map(i=>({lat:parseFloat(i.lat),lng:parseFloat(i.lon),display_name:i.display_name}));}catch(e){return [];}
    }

    function escapeHtml(str){return str.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

    // ============================================================
    // =============== FOOD TAB WITH DRIVER TRACKING ==============
    // ============================================================
    function renderCustomerFoodTab(container) {
        if (foodOrdersUnsubscribe) {
            foodOrdersUnsubscribe();
            foodOrdersUnsubscribe = null;
        }
        // Cleanup any existing tracking
        Object.values(foodTrackingUnsubs).forEach(unsub => unsub());
        Object.keys(foodTrackingUnsubs).forEach(key => delete foodTrackingUnsubs[key]);

        let foodOrders = [];

        function renderDriverMapForOrder(orderId, driverId) {
            const mapContainerId = `foodMap_${orderId}`;
            const mapContainer = document.getElementById(mapContainerId);
            if (!mapContainer) return;
            if (window[`foodMap_${orderId}`]) {
                window[`foodMap_${orderId}`].remove();
                delete window[`foodMap_${orderId}`];
            }
            if (foodTrackingUnsubs[orderId]) {
                foodTrackingUnsubs[orderId]();
                delete foodTrackingUnsubs[orderId];
            }

            const map = L.map(mapContainerId).setView([-15.3875, 28.3228], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            window[`foodMap_${orderId}`] = map;

            let driverMarker = L.marker([-15.3875, 28.3228], {
                icon: L.divIcon({ html: '<i class="fas fa-motorcycle text-amber-600 text-xl"></i>', iconSize: [24,24] })
            }).addTo(map).bindTooltip('Driver');

            const unsub = onSnapshot(doc(db, "drivers", driverId), (docSnap) => {
                if (docSnap.exists()) {
                    const loc = docSnap.data();
                    const lat = loc.currentLat || -15.3875;
                    const lng = loc.currentLng || 28.3228;
                    driverMarker.setLatLng([lat, lng]);
                    map.setView([lat, lng], 14);
                    driverMarker.bindTooltip(`Driver en route`).openTooltip();
                }
            });
            foodTrackingUnsubs[orderId] = unsub;
        }

        function updateOrderHistory() {
            const historyContainer = document.getElementById('foodOrderHistory');
            if (!historyContainer) return;
            if (foodOrders.length === 0) {
                historyContainer.innerHTML = '<div class="text-sm opacity-60">No orders yet</div>';
                return;
            }
            historyContainer.innerHTML = foodOrders.map(o => {
                const statusColors = {
                    pending: 'text-amber-400 bg-amber-50 dark:bg-amber-900',
                    accepted: 'text-blue-400 bg-blue-50 dark:bg-blue-900',
                    delivered: 'text-green-500 bg-green-50 dark:bg-green-900'
                };
                const statusLabel = o.status.charAt(0).toUpperCase() + o.status.slice(1);
                const showMap = o.status === 'accepted' && o.driverId;
                // Tracking link (shareable)
                const trackingLink = o.id ? `${window.location.origin}/track?order=${o.id}` : '';
                return `
                    <div class="border-b border-gray-100 dark:border-gray-700 py-3">
                        <div class="flex justify-between items-center">
                            <span class="font-medium">Order #${o.id.substring(0,6)}</span>
                            <span class="text-xs px-2 py-0.5 rounded-full ${statusColors[o.status] || 'bg-gray-100'}">${statusLabel}</span>
                        </div>
                        <div class="text-xs mt-1">${o.items.map(i => `${i.name} × ${i.qty}`).join(', ')}</div>
                        <div class="text-xs text-gray-400">${CURRENCY}${o.total} • ${formatDate(o.createdAt)}</div>
                        ${o.driverName ? `<div class="text-xs text-gray-400">🚚 Driver: ${o.driverName}</div>` : ''}
                        ${showMap ? `<div id="foodMap_${o.id}" class="map-container mt-2" style="height:150px;"></div>` : ''}
                        ${trackingLink ? `<div class="mt-1"><span class="tracking-link" onclick="navigator.clipboard.writeText('${trackingLink}').then(()=>Swal.fire({title:'Link copied!',icon:'success',timer:800}))">🔗 Share tracking link</span></div>` : ''}
                        ${o.status === 'delivered' ? `
                            <div class="mt-1 flex gap-2">
                                <button class="rate-driver text-xs bg-green-100 dark:bg-green-900 px-2 py-0.5 rounded" data-req="${o.id}" data-driver="${o.driverId || ''}">⭐ Rate Driver</button>
                                <button class="rate-customer text-xs bg-blue-100 dark:bg-blue-900 px-2 py-0.5 rounded" data-req="${o.id}" data-customer="${o.customerId}">⭐ Rate Customer</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            // Rating buttons
            document.querySelectorAll('.rate-driver').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const reqId = btn.dataset.req;
                    const driverId = btn.dataset.driver;
                    if (!driverId) return Swal.fire('No driver assigned');
                    const { value: rating } = await Swal.fire({
                        title: 'Rate Driver',
                        input: 'range',
                        inputLabel: 'Rating (1-5)',
                        inputAttributes: { min: 1, max: 5, step: 1, value: 5 },
                        showCancelButton: true
                    });
                    if (rating) {
                        const { value: comment } = await Swal.fire({
                            title: 'Comment (optional)',
                            input: 'text',
                            showCancelButton: true
                        });
                        await rateDriver(reqId, driverId, parseInt(rating), comment || '');
                    }
                });
            });
            document.querySelectorAll('.rate-customer').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const reqId = btn.dataset.req;
                    const customerId = btn.dataset.customer;
                    if (!customerId) return Swal.fire('No customer');
                    const { value: rating } = await Swal.fire({
                        title: 'Rate Customer',
                        input: 'range',
                        inputLabel: 'Rating (1-5)',
                        inputAttributes: { min: 1, max: 5, step: 1, value: 5 },
                        showCancelButton: true
                    });
                    if (rating) {
                        const { value: comment } = await Swal.fire({
                            title: 'Comment (optional)',
                            input: 'text',
                            showCancelButton: true
                        });
                        await rateCustomer(reqId, customerId, parseInt(rating), comment || '');
                    }
                });
            });

            foodOrders.forEach(o => {
                if (o.status === 'accepted' && o.driverId) {
                    setTimeout(() => renderDriverMapForOrder(o.id, o.driverId), 100);
                }
            });
        }

        // ---- Restaurants ----
        const loadRestaurants = async () => {
            const snap = await getDocs(collection(db, "restaurants"));
            if (!snap.empty) {
                allRestaurants = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            } else {
                const defaultRestaurants = [
                    { name: "KFC", logo: "🍗", cuisine: "Fast Food", location: "Lusaka", open: true, items: [{name:"Zinger Burger", price:35},{name:"Fries", price:15},{name:"Coke", price:8}] },
                    { name: "Hungry Lion", logo: "🐔", cuisine: "Fast Food", location: "Lusaka", open: true, items: [{name:"Chicken Meal", price:40},{name:"Chips", price:12},{name:"Milkshake", price:18}] },
                    { name: "Shoprite", logo: "🛒", cuisine: "Supermarket", location: "Lusaka", open: true, items: [{name:"Grocery pack", price:50},{name:"Bread", price:7},{name:"Milk", price:12}] },
                    { name: "Pick n Pay", logo: "🛍️", cuisine: "Supermarket", location: "Lusaka", open: true, items: [{name:"Fruit Basket", price:30},{name:"Juice", price:10},{name:"Snacks", price:15}] },
                    { name: "Game", logo: "🎮", cuisine: "Supermarket", location: "Lusaka", open: true, items: [{name:"Electronics", price:200},{name:"Household", price:45},{name:"Toys", price:25}] }
                ];
                for (const r of defaultRestaurants) {
                    await addDoc(collection(db, "restaurants"), r);
                }
                allRestaurants = defaultRestaurants;
            }
            renderRestaurantList();
        };

        const renderRestaurantList = () => {
            container.innerHTML = `
                <h3 class="text-xl font-bold mb-3">🍔 Order Food</h3>
                <div id="foodContent" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    ${allRestaurants.map(r => `
                        <div class="restaurant-card" data-id="${r.id || r.name}">
                            <div class="flex items-center gap-2">
                                <span class="text-3xl">${r.logo || '🍽️'}</span>
                                <div>
                                    <div class="font-bold">${r.name}</div>
                                    <div class="text-xs opacity-60">${r.cuisine || ''} • ${r.location || ''}</div>
                                </div>
                            </div>
                            <button class="view-menu-btn mt-2 text-sm bg-primary text-white px-3 py-1 rounded-full">View Menu</button>
                        </div>
                    `).join('')}
                </div>
                <div id="foodCartPanel" class="mt-4 border-t pt-3">
                    <div class="flex justify-between items-center">
                        <span class="font-bold">🛒 Cart</span>
                        <span id="cartCount">0 items</span>
                    </div>
                    <div id="cartItems" class="mt-2"></div>
                    <div class="flex gap-2 mt-2">
                        <input type="text" id="foodPromoInput" placeholder="Promo code" class="text-sm flex-1">
                        <button id="foodApplyPromo" class="text-xs bg-amber-100 dark:bg-amber-900 px-3 py-1 rounded-full">Apply</button>
                    </div>
                    <button id="checkoutFoodBtn" class="btn-primary w-full mt-2">Checkout (${CURRENCY}0.00)</button>
                </div>
                <div class="mt-4 border-t pt-3">
                    <h4 class="font-bold">📜 My Food Orders (live)</h4>
                    <div id="foodOrderHistory" class="max-h-64 overflow-auto"></div>
                </div>
            `;

            // Food promo
            let foodPromo = null;
            document.getElementById('foodApplyPromo')?.addEventListener('click', () => {
                const code = document.getElementById('foodPromoInput')?.value?.toUpperCase()?.trim();
                if (!code) return Swal.fire('Enter a code');
                if (PROMO_CODES[code] !== undefined) {
                    foodPromo = { code, discount: PROMO_CODES[code] };
                    Swal.fire({ title: `Promo applied! ${code} – ${PROMO_CODES[code]*100}% off`, icon: 'success', timer: 1500 });
                    updateCartUI();
                } else Swal.fire('Invalid code', 'Try SAVE10, SAVE20, or FREE', 'warning');
            });

            // View Menu
            document.querySelectorAll('.view-menu-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const card = e.target.closest('.restaurant-card');
                    const name = card.querySelector('.font-bold').innerText;
                    const restaurant = allRestaurants.find(r => r.name === name);
                    if (!restaurant) return;

                    let menuHtml = restaurant.items.map((item, idx) => `
                        <div class="menu-item flex justify-between items-center py-2 border-b border-gray-200 dark:border-gray-700">
                            <span>${item.name}</span>
                            <div class="flex items-center gap-2">
                                <span>${CURRENCY}${item.price}</span>
                                <div class="flex items-center gap-1">
                                    <button class="qty-minus text-sm bg-gray-200 dark:bg-gray-700 px-2 rounded" data-idx="${idx}">−</button>
                                    <span class="qty-display w-6 text-center" data-idx="${idx}">1</span>
                                    <button class="qty-plus text-sm bg-gray-200 dark:bg-gray-700 px-2 rounded" data-idx="${idx}">+</button>
                                </div>
                                <button class="add-to-cart-btn bg-primary text-white text-xs px-3 py-1 rounded-full" 
                                        data-restaurant="${restaurant.name}" 
                                        data-name="${item.name}" 
                                        data-price="${item.price}" 
                                        data-idx="${idx}">Add</button>
                            </div>
                        </div>
                    `).join('');

                    Swal.fire({
                        title: `${restaurant.logo || '🍽️'} ${restaurant.name}`,
                        html: `<div class="text-left max-h-80 overflow-auto">${menuHtml}</div>`,
                        confirmButtonText: 'Close',
                        didOpen: () => {
                            document.querySelectorAll('.qty-minus, .qty-plus').forEach(b => {
                                b.addEventListener('click', () => {
                                    const idx = parseInt(b.dataset.idx);
                                    const display = document.querySelector(`.qty-display[data-idx="${idx}"]`);
                                    let val = parseInt(display.textContent);
                                    if (b.classList.contains('qty-minus')) val = Math.max(1, val - 1);
                                    else val = Math.min(99, val + 1);
                                    display.textContent = val;
                                });
                            });

                            document.querySelectorAll('.add-to-cart-btn').forEach(b => {
                                b.addEventListener('click', () => {
                                    const rname = b.dataset.restaurant;
                                    const iname = b.dataset.name;
                                    const iprice = parseFloat(b.dataset.price);
                                    const idx = parseInt(b.dataset.idx);
                                    const qtyDisplay = document.querySelector(`.qty-display[data-idx="${idx}"]`);
                                    const qty = parseInt(qtyDisplay.textContent);

                                    const existing = foodCart.find(x => x.restaurant === rname && x.name === iname);
                                    if (existing) existing.qty += qty;
                                    else foodCart.push({ restaurant: rname, name: iname, price: iprice, qty });

                                    updateCartUI();
                                    Swal.fire({ title: `Added ${qty} × ${iname}`, icon: 'success', timer: 800, showConfirmButton: false });
                                });
                            });
                        }
                    });
                });
            });

            const updateCartUI = () => {
                const countSpan = document.getElementById('cartCount');
                const itemsDiv = document.getElementById('cartItems');
                const checkoutBtn = document.getElementById('checkoutFoodBtn');

                if (countSpan) countSpan.innerText = foodCart.reduce((s, i) => s + i.qty, 0) + ' items';

                if (itemsDiv) {
                    if (foodCart.length === 0) {
                        itemsDiv.innerHTML = '<div class="text-sm opacity-60">Cart is empty</div>';
                    } else {
                        itemsDiv.innerHTML = foodCart.map((i, idx) => `
                            <div class="cart-item flex justify-between items-center py-1 border-b border-gray-100 dark:border-gray-700">
                                <span>${i.name} × ${i.qty}</span>
                                <span class="flex items-center gap-2">
                                    ${CURRENCY}${(i.price * i.qty).toFixed(2)}
                                    <button class="remove-cart-item text-red-500 text-xs" data-index="${idx}">✕</button>
                                </span>
                            </div>
                        `).join('');

                        document.querySelectorAll('.remove-cart-item').forEach(b => {
                            b.addEventListener('click', () => {
                                const idx = parseInt(b.dataset.index);
                                foodCart.splice(idx, 1);
                                updateCartUI();
                            });
                        });
                    }
                }

                if (checkoutBtn) {
                    let total = foodCart.reduce((s, i) => s + i.price * i.qty, 0);
                    if (foodPromo) total = total * (1 - foodPromo.discount);
                    checkoutBtn.innerText = `Checkout (${CURRENCY}${total.toFixed(2)})${foodPromo ? ' ✨' : ''}`;
                }
            };

            document.getElementById('checkoutFoodBtn').addEventListener('click', async () => {
                if (foodCart.length === 0) return Swal.fire('Cart empty', 'Add some items first.', 'info');

                let deliveryAddr = tempPickupAddress || '';
                if (!deliveryAddr) {
                    const { value: addr } = await Swal.fire({
                        title: 'Delivery address',
                        input: 'text',
                        inputLabel: 'Where should we deliver?',
                        inputPlaceholder: 'e.g. 123 Main St, Lusaka',
                        showCancelButton: true
                    });
                    if (!addr) return;
                    deliveryAddr = addr;
                }

                let total = foodCart.reduce((sum, i) => sum + i.price * i.qty, 0);
                if (foodPromo) total = total * (1 - foodPromo.discount);

                try {
                    Swal.fire({ title: 'Placing order...', timer: 1500, didOpen: () => Swal.showLoading() });

                    const order = {
                        customerId: currentUser.uid,
                        customerName: currentUser.email,
                        items: foodCart.map(i => ({ name: i.name, price: i.price, qty: i.qty })),
                        total: Math.round(total * 100) / 100,
                        deliveryAddress: deliveryAddr,
                        status: 'pending',
                        driverId: null,
                        driverName: null,
                        createdAt: serverTimestamp(),
                        promoCode: foodPromo?.code || null
                    };
                    await addDoc(collection(db, "foodOrders"), order);

                    foodCart = [];
                    foodPromo = null;
                    document.getElementById('foodPromoInput').value = '';
                    updateCartUI();

                    Swal.fire({ title: 'Order placed!', icon: 'success', timer: 2000, showConfirmButton: false });
                    showNotification('Food order', 'Your order is being prepared.');
                } catch (e) {
                    Swal.fire('Error', e.message, 'error');
                }
            });

            // Real‑time listener
            const q = query(
                collection(db, "foodOrders"),
                where("customerId", "==", currentUser.uid),
                orderBy("createdAt", "desc")
            );
            foodOrdersUnsubscribe = onSnapshot(q, (snap) => {
                foodOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                updateOrderHistory();
            });

            updateCartUI();
        };

        loadRestaurants();
    }
